<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI物体追跡カメラ</title>
  <!-- TensorFlow.js と COCO-SSD モデルを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 16px;
      letter-spacing: 0.15em;
      color: #ff4444;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    .control-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 720px;
    }
    button {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 7px 14px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1a1a1a;
      color: #ccc;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: #2a2a2a; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.active-cam { background: #c0392b; color: #fff; border-color: #e74c3c; }
    label { font-size: 11px; color: #888; }

    #canvas-wrap {
      position: relative;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 4/3;
    }
    #vid, #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #vid { opacity: 0; }
    #info {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      display: flex;
      gap: 20px;
    }
    #status { color: #ffbb00; }
    #target-list { color: #aaa; margin-bottom: 10px; font-size: 11px;}
  </style>
</head>
<body>

<h1>▶ AI Object Tracker</h1>
<div id="target-list">対象: 人(person), 車(car), 自転車(bicycle), ボール(sports ball)</div>

<div class="control-row">
  <button id="btnStart">カメラ起動 & モデル読込</button>
  <button id="btnStop" disabled>停止</button>
  <label>軌跡の長さ
    <input type="range" id="trail" min="5" max="100" value="30">
    <span id="trailVal">30</span>
  </label>
  <span id="status">待機中</span>
</div>

<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="info">
  <div>検知数: <span id="objCount" style="color:#fff">0</span></div>
  <div>FPS: <span id="fps" style="color:#fff">0</span></div>
</div>

<script>
const vid = document.getElementById('vid');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const statusEl = document.getElementById('status');
const trailEl = document.getElementById('trail');
const trailValEl = document.getElementById('trailVal');
const objCountEl = document.getElementById('objCount');
const fpsEl = document.getElementById('fps');

let stream = null;
let model = null;
let animId = null;
let trails = {}; // 物体IDごとに軌跡を保持
let maxTrailLen = 30;
let frameCount = 0;
let lastFpsTime = performance.now();

// 追跡対象のラベル（COCO-SSDの定義に準拠）
const TARGET_CLASSES = ['person', 'car', 'bicycle', 'sports ball'];

trailEl.addEventListener('input', () => { 
  maxTrailLen = +trailEl.value; 
  trailValEl.textContent = maxTrailLen; 
});

// モデルとカメラの初期化
btnStart.addEventListener('click', async () => {
  statusEl.textContent = 'モデル読み込み中...';
  btnStart.disabled = true;

  try {
    // 1. モデルのロード
    if (!model) {
      model = await cocoSsd.load();
    }
    
    // 2. カメラの起動
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: 640, height: 480 }
    });
    vid.srcObject = stream;
    await vid.play();

    btnStop.disabled = false;
    btnStop.classList.add('active-cam');
    statusEl.textContent = '追跡中';
    
    // 描画ループ開始
    loop();
  } catch (e) {
    alert('エラー: ' + e.message);
    btnStart.disabled = false;
    statusEl.textContent = 'エラー';
  }
});

btnStop.addEventListener('click', () => {
  if (animId) cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  btnStart.disabled = false;
  btnStop.disabled = true;
  btnStop.classList.remove('active-cam');
  statusEl.textContent = '停止中';
  trails = {};
});

async function loop() {
  const W = canvas.width = canvas.parentElement.clientWidth;
  const H = canvas.height = canvas.parentElement.clientHeight;

  // 1. 映像をキャンバスに描画
  ctx.save();
  ctx.scale(-1, 1); // 鏡像
  ctx.drawImage(vid, -W, 0, W, H);
  ctx.restore();

  // 2. 物体認識を実行
  const predictions = await model.detect(vid);

  // 3. 対象の物体だけフィルタリングして描画
  const detectedTargets = predictions.filter(p => TARGET_CLASSES.includes(p.class));
  objCountEl.textContent = detectedTargets.length;

  detectedTargets.forEach((p, i) => {
    // 中心点を計算（鏡像に合わせて反転）
    const x = W - (p.bbox[0] + p.bbox[2] / 2) * (W / vid.videoWidth);
    const y = (p.bbox[1] + p.bbox[3] / 2) * (H / vid.videoHeight);
    
    // 簡易的なID管理（今回はインデックスを使用）
    const id = p.class + "_" + i;
    if (!trails[id]) trails[id] = [];
    
    trails[id].push({x, y});
    if (trails[id].length > maxTrailLen) trails[id].shift();

    // 軌跡の描画
    drawTrail(trails[id], p.class);
  });

  // 古い軌跡（検知されなくなったもの）を徐々に削除
  Object.keys(trails).forEach(id => {
    const isStillDetected = detectedTargets.some((p, i) => (p.class + "_" + i) === id);
    if (!isStillDetected && trails[id].length > 0) {
      trails[id].shift();
    }
  });

  // FPS計算
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime > 1000) {
    fpsEl.textContent = Math.round(frameCount / ((now - lastFpsTime) / 1000));
    frameCount = 0; lastFpsTime = now;
  }

  animId = requestAnimationFrame(loop);
}

function drawTrail(points, label) {
  if (points.length < 2) return;

  // 線を描画
  ctx.beginPath();
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.stroke();

  // 先端の点
  const last = points[points.length - 1];
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(last.x, last.y, 6, 0, Math.PI * 2);
  ctx.fill();

  // ラベル表示
  ctx.fillStyle = '#fff';
  ctx.font = '12px Arial';
  ctx.fillText(label, last.x + 10, last.y - 10);
}
</script>
</body>
</html>

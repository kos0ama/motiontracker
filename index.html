<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Cameraman Pro</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050505; color: #ccc; font-family: 'Courier New', monospace; overflow-x: hidden; }

    #app { display: flex; flex-direction: column; min-height: 100dvh; }

    /* Video top */
    #video-area { position: relative; width: 100%; background: #000; flex-shrink: 0; }
    #canvas-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #0a0a0a; overflow: hidden; }
    #vid    { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; pointer-events:none; }
    #canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

    /* Landscape */
    @media (orientation: landscape) {
      #app { flex-direction: row; height: 100dvh; overflow: hidden; }
      #video-area { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; }
      #canvas-wrap { width:auto; height:100dvh; aspect-ratio:16/9; }
      #ctrl-area { width:240px; flex:none; height:100dvh; overflow-y:auto; border-left:1px solid #141414; }
    }

    #ctrl-area { flex:1; overflow-y:auto; padding:10px 10px 24px; display:flex; flex-direction:column; gap:7px; }

    .section { background:#0d0d0d; border:1px solid #1a1a1a; border-radius:8px; padding:8px 10px; }
    .section-title { font-size:9px; color:#3a3a3a; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px; font-weight:bold; }

    button {
      font-family:'Courier New',monospace; font-size:11px; padding:6px 9px;
      border:1px solid #2a2a2a; border-radius:6px; background:#151515; color:#999;
      cursor:pointer; transition:all 0.12s; white-space:nowrap;
    }
    button:hover:not(:disabled) { background:#1f1f1f; color:#ddd; }
    button:disabled { opacity:0.25; cursor:default; }
    .btn-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }

    .btn-start  { border-color:#1e5631; color:#4ead70; }
    .btn-stop   { border-color:#7a2c2c; color:#d06b6b; }
    .btn-shot   { border-color:#1a4a6b; color:#5dade2; }
    .btn-rec    { border-color:#5b3a6b; color:#a37db3; }
    .btn-rec.recording { background:#5b3a6b; color:#fff; animation:pulse 1.2s infinite; }
    .btn-ai { border-color:#6b5a08; color:#d4b03f; }
    .btn-ai.on { background:#2d2500; color:#f9e300; border-color:#d4b03f; }

    .mode-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 9px; border:1px solid #242424; border-radius:20px;
      font-size:10px; color:#555; cursor:pointer; background:#111;
      transition:all 0.12s; user-select:none;
    }
    .mode-chip.on { border-color:var(--cc,#d4b03f); color:var(--cc,#d4b03f); background:color-mix(in srgb,var(--cc,#d4b03f) 10%,#111); }
    .mode-dot { width:5px; height:5px; border-radius:50%; background:var(--cc,#666); opacity:0.35; flex-shrink:0; }
    .mode-chip.on .mode-dot { opacity:1; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

    select { background:#151515; color:#aaa; border:1px solid #2a2a2a; border-radius:4px; font-size:10px; padding:4px 6px; font-family:'Courier New',monospace; }
    input[type=range] { accent-color:#d4b03f; width:100%; }
    label.lbl { font-size:10px; color:#444; display:block; margin-top:5px; }

    /* HUD */
    .hud { position:absolute; font-size:10px; letter-spacing:0.07em; pointer-events:none; }
    #fpsHud     { top:8px; left:10px; color:#333; }
    #recHud     { top:8px; right:10px; color:#9b59b6; display:none; }
    #aiHud      { top:8px; left:50%; transform:translateX(-50%); color:#d4b03f; display:none; background:rgba(0,0,0,0.5); padding:2px 10px; border-radius:20px; }
    #shotFlash  { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity 0.05s; }
    #modelStatus{ bottom:8px; left:10px; color:#2a2a2a; font-size:9px; }
    #chanceHud  { bottom:30px; left:50%; transform:translateX(-50%); display:none; white-space:nowrap;
                  background:rgba(212,176,63,0.9); color:#000; font-weight:bold; padding:4px 14px; border-radius:20px; font-size:11px; }
    #bufStatus  { top:30px; left:10px; color:#888; display:none; font-size:9px;
                  background:rgba(0,0,0,0.6); padding:2px 8px; border-radius:10px; }
    #frameGuide { position:absolute; inset:0; pointer-events:none; }

    /* Gallery */
    #galleryGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:5px; }
    .gallery-item { border:1px solid #1a1a1a; border-radius:5px; overflow:hidden; position:relative; background:#0a0a0a; }
    .gallery-item img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
    .gallery-thumb-video { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; pointer-events:none; }
    .gallery-item-video  { cursor:pointer; }
    .gallery-item-video:hover { border-color:#555; }
    .play-overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    .play-icon {
      width:32px; height:32px; border-radius:50%;
      background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center;
      font-size:14px; color:#fff;
    }
    .dl-btn { position:absolute; bottom:3px; right:3px; font-size:9px; padding:2px 5px; border-radius:3px; background:rgba(0,0,0,0.85); border:1px solid #444; color:#ccc; cursor:pointer; z-index:5; }
    .gallery-item .badge { position:absolute; top:3px; left:3px; font-size:8px; padding:1px 5px; border-radius:10px; z-index:5; }
    .badge-auto { background:rgba(212,176,63,0.9); color:#000; }
    .badge-clip { background:rgba(88,214,141,0.9); color:#000; }
    .badge-shot { background:rgba(93,173,226,0.85); color:#000; }
    .badge-rec  { background:rgba(142,68,173,0.85); color:#fff; }

    /* ===== Video Player Modal ===== */
    #playerModal {
      display:none; position:fixed; inset:0; z-index:2000;
      background:rgba(0,0,0,0.94); align-items:center; justify-content:center; padding:16px;
    }
    #playerModal.open { display:flex; }
    #playerBox {
      background:#111; border:1px solid #2a2a2a; border-radius:12px; padding:16px;
      width:100%; max-width:720px; max-height:95dvh; overflow-y:auto;
    }
    #playerBox h3 { font-size:10px; color:#555; letter-spacing:0.12em; margin-bottom:10px; text-transform:uppercase; }
    #playerVideo { width:100%; border-radius:6px; background:#000; display:block; margin-bottom:10px; }
    .player-speed-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
    .player-speed-row button { font-size:11px; padding:5px 10px; }
    .player-speed-row button.active { background:#27ae60; color:#fff; border-color:#2ecc71; }
    .player-frame-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .player-frame-row button { font-size:11px; padding:5px 10px; }
    #playerClose { margin-left:auto; border-color:#555; color:#666; }
    #playerClose:hover { background:#1a1a1a; color:#fff; }
    #playerSpeedLabel { font-size:11px; color:#7dcea0; min-width:36px; }
  </style>
</head>
<body>
<div id="app">

  <!-- VIDEO -->
  <div id="video-area">
    <div id="canvas-wrap">
      <video id="vid" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <svg id="frameGuide" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hud" id="fpsHud">-- fps</div>
      <div class="hud" id="recHud">⏺ REC</div>
      <div class="hud" id="aiHud">🎬 AI CAMERAMAN</div>
      <div class="hud" id="chanceHud">📸 シャッターチャンス！</div>
      <div class="hud" id="bufStatus"></div>
      <div class="hud" id="modelStatus">Loading models...</div>
      <div id="shotFlash"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div id="ctrl-area">

    <!-- Camera -->
    <div class="section">
      <div class="section-title">Camera</div>
      <select id="camSelect" style="width:100%;margin-bottom:6px;"><option>Loading...</option></select>
      <div class="btn-row">
        <button id="btnStart" class="btn-start">▶ START</button>
        <button id="btnStop"  class="btn-stop" disabled>■ STOP</button>
      </div>
      <label class="lbl">画質
        <select id="qualitySelect" style="width:100%;margin-top:4px;">
          <option value="480">480p (SD)</option>
          <option value="720" selected>720p (HD)</option>
          <option value="1080">1080p (FHD)</option>
          <option value="2160">2160p (4K — デバイス依存)</option>
        </select>
      </label>
    </div>

    <!-- AI Cameraman -->
    <div class="section">
      <div class="section-title">AI Cameraman</div>
      <div class="btn-row" style="margin-bottom:6px;">
        <button id="btnAI" class="btn-ai" disabled>🎬 AI OFF</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">
        <div class="mode-chip on" data-mode="autoframe" style="--cc:#d4b03f;"><span class="mode-dot"></span>フレーム</div>
        <div class="mode-chip on" data-mode="pose"      style="--cc:#4ead70;"><span class="mode-dot"></span>ポーズ</div>
        <div class="mode-chip on" data-mode="smile"     style="--cc:#a37db3;"><span class="mode-dot"></span>笑顔</div>
        <div class="mode-chip on" data-mode="still"     style="--cc:#5dade2;"><span class="mode-dot"></span>静止</div>
      </div>
      <label class="lbl">余白：<span id="paddingVal">30</span>%
        <input type="range" id="paddingSlider" min="10" max="60" value="30">
      </label>
      <label class="lbl">平滑化：<span id="smoothVal">0.08</span>
        <input type="range" id="smoothSlider" min="2" max="20" value="8">
      </label>
      <label class="lbl">感度：<span id="sensVal">0.85</span>
        <input type="range" id="sensSlider" min="60" max="98" value="85">
      </label>
    </div>

    <!-- Auto Clip -->
    <div class="section">
      <div class="section-title">Auto Clip (静止検知時)</div>
      <label class="lbl">前：<span id="preVal">10</span>秒
        <input type="range" id="preSlider" min="3" max="30" value="10">
      </label>
      <label class="lbl">後：<span id="postVal">3</span>秒
        <input type="range" id="postSlider" min="1" max="15" value="3">
      </label>
      <label class="lbl" style="display:flex;align-items:center;gap:6px;margin-top:6px;">
        <input type="checkbox" id="chkSaveStill" checked> 静止写真も保存
      </label>
    </div>

    <!-- Record / Shot -->
    <div class="section">
      <div class="section-title">Record / Shot</div>
      <div class="btn-row">
        <button id="btnShot"    class="btn-shot" disabled>📷 SHOT</button>
        <button id="btnRec"     class="btn-rec"  disabled>⏺ REC</button>
        <button id="btnRecStop" class="btn-rec"  disabled>⏹ STOP</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="section">
      <div class="section-title">Settings</div>
      <label class="lbl">軌跡：<span id="trailVal">30</span>
        <input type="range" id="trail" min="5" max="100" value="30">
      </label>
    </div>

    <!-- Gallery -->
    <div class="section">
      <div class="section-title">Gallery <span id="galleryCount" style="color:#333;"></span></div>
      <div id="galleryGrid"></div>
    </div>

  </div>
</div>

<!-- ===== VIDEO PLAYER MODAL ===== -->
<div id="playerModal">
  <div id="playerBox">
    <h3>▶ Video Player</h3>
    <video id="playerVideo" controls playsinline></video>
    <div class="player-speed-row">
      <span style="font-size:10px;color:#555;">速度：</span>
      <button data-rate="0.25">¼x</button>
      <button data-rate="0.5">½x</button>
      <button data-rate="1" class="active">1x</button>
      <button data-rate="2">2x</button>
      <span id="playerSpeedLabel">1x</span>
    </div>
    <div class="player-frame-row">
      <button id="btnFramePrev">◀◀ コマ戻し</button>
      <button id="btnFrameNext">コマ送り ▶▶</button>
      <button id="playerClose">✕ 閉じる</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════
const vid           = document.getElementById('vid');
const canvas        = document.getElementById('canvas');
const ctx           = canvas.getContext('2d');
const camSelect     = document.getElementById('camSelect');
const qualitySelect = document.getElementById('qualitySelect');
const btnStart      = document.getElementById('btnStart');
const btnStop       = document.getElementById('btnStop');
const btnShot       = document.getElementById('btnShot');
const btnRec        = document.getElementById('btnRec');
const btnRecStop    = document.getElementById('btnRecStop');
const btnAI         = document.getElementById('btnAI');
const modelStatus   = document.getElementById('modelStatus');
const fpsHud        = document.getElementById('fpsHud');
const recHud        = document.getElementById('recHud');
const aiHud         = document.getElementById('aiHud');
const chanceHud     = document.getElementById('chanceHud');
const bufStatus     = document.getElementById('bufStatus');
const shotFlash     = document.getElementById('shotFlash');
const frameGuide    = document.getElementById('frameGuide');
const trailSlider   = document.getElementById('trail');
const trailValEl    = document.getElementById('trailVal');
const canvasWrap    = document.getElementById('canvas-wrap');
const paddingSlider = document.getElementById('paddingSlider');
const smoothSlider  = document.getElementById('smoothSlider');
const sensSlider    = document.getElementById('sensSlider');
const preSlider     = document.getElementById('preSlider');
const postSlider    = document.getElementById('postSlider');
const chkSaveStill  = document.getElementById('chkSaveStill');
const playerModal   = document.getElementById('playerModal');
const playerVideo   = document.getElementById('playerVideo');
const playerClose   = document.getElementById('playerClose');
const btnFramePrev  = document.getElementById('btnFramePrev');
const btnFrameNext  = document.getElementById('btnFrameNext');

// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════
let cocoModel    = null;
let poseDetector = null;
let faceMesh     = null;
let stream       = null;
let isRunning    = false;
let drawAnimId   = null;
let isFrontCam   = false;

let mediaRecorder  = null;
let recordedChunks = [];

let aiMode   = false;
let subModes = { autoframe:true, pose:true, smile:true, still:true };

let cocoDetections = [];
let poseResults    = null;
let faceResults    = null;

// オートフレーミング
const viewport = { sx:0, sy:0, sw:1, sh:1 };
const smoothVp = { sx:0, sy:0, sw:1, sh:1 };

let trails = {};

// ★ 循環バッファ（Blob単位で録画チャンクを溜める）
// MediaRecorderを常時RUNし、チャンクをリングバッファに保持する方式
let circRecorder   = null;  // 常時録画用MediaRecorder
let circChunks     = [];    // { blob, ts }
const CIRC_MAX_MS  = 35000; // 最大35秒保持

// シャッターチャンス
let lastShotTs    = 0;
const SHOT_COOLDOWN = 3000;
let chanceTimer   = null;

// 静止検知
const wristHistory   = [];
const WRIST_HIST_LEN = 20;
let wasMoving = false;

// クリップ生成中フラグ
let clipInProgress = false;

// FPS
let fpsFrames = 0, fpsLast = performance.now();

// ═══════════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════════
trailSlider.addEventListener('input',   () => { trailValEl.textContent = trailSlider.value; });
paddingSlider.addEventListener('input', () => { document.getElementById('paddingVal').textContent = paddingSlider.value; });
smoothSlider.addEventListener('input',  () => { document.getElementById('smoothVal').textContent  = (+smoothSlider.value/100).toFixed(2); });
sensSlider.addEventListener('input',    () => { document.getElementById('sensVal').textContent    = (+sensSlider.value/100).toFixed(2); });
preSlider.addEventListener('input',     () => { document.getElementById('preVal').textContent  = preSlider.value; });
postSlider.addEventListener('input',    () => { document.getElementById('postVal').textContent = postSlider.value; });

document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const m = chip.dataset.mode;
    subModes[m] = !subModes[m];
    chip.classList.toggle('on', subModes[m]);
  });
});

// ═══════════════════════════════════════════
// Canvas size sync
// ═══════════════════════════════════════════
function syncCanvasSize() {
  const r = canvasWrap.getBoundingClientRect();
  const W = Math.round(r.width), H = Math.round(r.height);
  if (canvas.width !== W || canvas.height !== H) { canvas.width=W; canvas.height=H; }
  return { W, H };
}
new ResizeObserver(() => { if (isRunning) syncCanvasSize(); }).observe(canvasWrap);

// ═══════════════════════════════════════════
// Init models
// ═══════════════════════════════════════════
async function init() {
  modelStatus.textContent = 'COCO loading...';
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cams.sort((a,b) => /back|rear|environment/i.test(b.label) - /back|rear|environment/i.test(a.label));
    camSelect.innerHTML = cams.map(d =>
      `<option value="${d.deviceId}">${d.label || 'Camera '+d.deviceId.slice(0,4)}</option>`
    ).join('');

    cocoModel = await cocoSsd.load();
    modelStatus.textContent = 'COCO ✓  Pose loading...';

    poseDetector = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}` });
    poseDetector.setOptions({ modelComplexity:1, smoothLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    poseDetector.onResults(r => { poseResults = r; });

    faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}` });
    faceMesh.setOptions({ maxNumFaces:3, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    faceMesh.onResults(r => { faceResults = r; });

    modelStatus.textContent = 'All models ready ✓';
  } catch(e) {
    modelStatus.textContent = 'Model error: ' + e.message;
  }
}
init();

// ═══════════════════════════════════════════
// Camera start
// ═══════════════════════════════════════════
btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stopCircRecorder();
  trails = {}; cocoDetections = []; poseResults = null; faceResults = null;
  circChunks = []; wristHistory.length = 0;
  Object.assign(smoothVp, {sx:0,sy:0,sw:1,sh:1});
  Object.assign(viewport, {sx:0,sy:0,sw:1,sh:1});

  try {
    const h = +qualitySelect.value;
    const w = h === 2160 ? 3840 : h === 1080 ? 1920 : h === 720 ? 1280 : 854;
    let constraints = { video: { facingMode:{ideal:'environment'}, width:{ideal:w}, height:{ideal:h} } };
    if (camSelect.value && !/Loading/.test(camSelect.value))
      constraints = { video: { deviceId:{exact:camSelect.value}, width:{ideal:w}, height:{ideal:h} } };

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream; await vid.play();

    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings();
    isFrontCam = settings.facingMode === 'user' || (track.label||'').toLowerCase().includes('front');

    modelStatus.textContent = `Ready ✓ ${settings.width||'?'}×${settings.height||'?'}`;

    btnStart.disabled=true; btnStop.disabled=false;
    btnShot.disabled=false; btnRec.disabled=false; btnAI.disabled=false;

    isRunning=true;
    fpsLast=performance.now(); fpsFrames=0;
    syncCanvasSize();
    drawLoop();
    cocoLoop();
    mediapipeLoop();
    startCircRecorder(); // 常時循環録画開始
  } catch(e) { alert('Camera Error: '+e.message); }
};

// ═══════════════════════════════════════════
// ★ 動画フォーマット選択（MP4優先・デバイス自動判定）
//   iOS Safari → MP4(H.264)
//   Android Chrome → WebM(VP9/H264) にフォールバック
// ═══════════════════════════════════════════
function getBestMimeType() {
  const candidates = [
    'video/mp4;codecs=avc1.424028,mp4a.40.2', // iOS Safari / Chrome 130+
    'video/mp4;codecs=h264',
    'video/mp4',
    'video/webm;codecs=h264',
    'video/webm;codecs=vp9',
    'video/webm',
  ];
  return candidates.find(t => {
    try { return MediaRecorder.isTypeSupported(t); } catch(e) { return false; }
  }) || '';
}

// 実際に使われるフォーマットをHUDに表示
function showFormatHud(mime) {
  const isMP4 = mime.toLowerCase().includes('mp4');
  modelStatus.textContent = `Ready ✓  動画: ${isMP4 ? 'MP4 (H.264)' : 'WebM'} ※デバイス自動選択`;
}

// ═══════════════════════════════════════════
// AI toggle
// ═══════════════════════════════════════════
btnAI.onclick = () => {
  aiMode = !aiMode;
  btnAI.textContent = aiMode ? '🎬 AI ON' : '🎬 AI OFF';
  btnAI.classList.toggle('on', aiMode);
  aiHud.style.display = aiMode ? 'block' : 'none';
  if (!aiMode) {
    Object.assign(smoothVp, {sx:0,sy:0,sw:1,sh:1});
    frameGuide.innerHTML='';
  }
};

// ═══════════════════════════════════════════
// ★ 循環録画（常時バックグラウンドで canvas を録画）
// ═══════════════════════════════════════════
function startCircRecorder() {
  if (!canvas.captureStream) return;
  const s = canvas.captureStream(30);
  const mime = getBestMimeType();
  showFormatHud(mime);
  try { circRecorder = new MediaRecorder(s, mime ? { mimeType: mime } : {}); }
  catch(e) { circRecorder = new MediaRecorder(s); }

  circRecorder.ondataavailable = e => {
    if (!e.data || e.data.size === 0) return;
    const now = performance.now();
    circChunks.push({ blob: e.data, ts: now });
    // 古いチャンクを削除
    const cutoff = now - CIRC_MAX_MS;
    while (circChunks.length > 0 && circChunks[0].ts < cutoff) circChunks.shift();
  };

  circRecorder.start(500); // 500ms ごとにチャンクを収集
}

function stopCircRecorder() {
  if (circRecorder && circRecorder.state !== 'inactive') {
    try { circRecorder.stop(); } catch(e) {}
  }
  circRecorder = null;
  circChunks = [];
}

// ═══════════════════════════════════════════
// DRAW LOOP
// ═══════════════════════════════════════════
function drawLoop() {
  if (!isRunning) return;
  const { W, H } = syncCanvasSize();
  if (!vid.videoWidth) { drawAnimId=requestAnimationFrame(drawLoop); return; }

  const vw=vid.videoWidth, vh=vid.videoHeight;

  if (aiMode && subModes.autoframe) computeAutoframing(vw, vh);
  else Object.assign(smoothVp, {sx:0,sy:0,sw:1,sh:1});

  const srcX=smoothVp.sx*vw, srcY=smoothVp.sy*vh;
  const srcW=smoothVp.sw*vw, srcH=smoothVp.sh*vh;

  ctx.save();
  if (isFrontCam) { ctx.scale(-1,1); ctx.drawImage(vid,srcX,srcY,srcW,srcH,-W,0,W,H); }
  else            { ctx.drawImage(vid,srcX,srcY,srcW,srcH,0,0,W,H); }
  ctx.restore();

  if (aiMode) {
    if (poseResults?.poseLandmarks) drawPoseSkeleton(poseResults.poseLandmarks, W,H, srcX,srcY,srcW,srcH, vw,vh);
    if (faceResults?.multiFaceLandmarks?.length) drawFaceContour(faceResults.multiFaceLandmarks[0], W,H, srcX,srcY,srcW,srcH, vw,vh);
    evaluateShutterChance();
  }

  fpsFrames++;
  const n=performance.now();
  if (n-fpsLast>1000) {
    fpsHud.textContent=Math.round(fpsFrames/((n-fpsLast)/1000))+' fps';
    fpsFrames=0; fpsLast=n;
  }

  drawAnimId=requestAnimationFrame(drawLoop);
}

// ═══════════════════════════════════════════
// COCO loop
// ═══════════════════════════════════════════
async function cocoLoop() {
  if (!isRunning) return;
  if (!cocoModel||!vid.videoWidth){setTimeout(cocoLoop,100);return;}
  try {
    const preds = await cocoModel.detect(vid);
    cocoDetections = preds.map(p => ({ classKey:p.class, bbox:p.bbox, score:p.score }));
  } catch(e) {}
  if (isRunning) setTimeout(cocoLoop,0);
}

// ═══════════════════════════════════════════
// MediaPipe loop
// ═══════════════════════════════════════════
let mpFrame=0;
async function mediapipeLoop() {
  if (!isRunning) return;
  if (!vid.videoWidth||!poseDetector){setTimeout(mediapipeLoop,100);return;}
  try {
    mpFrame++;
    await poseDetector.send({ image:vid });
    if (mpFrame%2===0 && faceMesh) await faceMesh.send({ image:vid });
  } catch(e) {}
  if (isRunning) setTimeout(mediapipeLoop,0);
}

// ═══════════════════════════════════════════
// AUTO FRAMING
// ═══════════════════════════════════════════
function computeAutoframing(vw,vh) {
  const persons = cocoDetections.filter(d=>d.classKey==='person');
  if (persons.length===0) { lerpVp(viewport,{sx:0,sy:0,sw:1,sh:1},0.02); lerpVp(smoothVp,viewport,getSmoothAlpha()); updateFrameGuide(null); return; }
  const cx=vw/2, cy=vh/2;
  const main = persons.reduce((best,p) => {
    const pcx=p.bbox[0]+p.bbox[2]/2, pcy=p.bbox[1]+p.bbox[3]/2;
    const score=p.bbox[2]*p.bbox[3] - Math.hypot(pcx-cx,pcy-cy)*0.5;
    return score>best.score ? {p,score} : best;
  },{p:persons[0],score:-Infinity}).p;

  const pad=+paddingSlider.value/100;
  const [bx,by,bw,bh]=main.bbox;
  const centerX=(bx+bw/2)/vw, centerY=(by+bh/2)/vh;
  const normW=(bw/vw)*(1+pad*2), normH=(bh/vh)*(1+pad*2);
  const aspect=16/9;
  let fw=Math.max(normW,normH*aspect), fh=fw/aspect;
  fw=Math.min(fw,1); fh=Math.min(fh,1);
  const fx=Math.max(0,Math.min(1-fw,centerX-fw/2));
  const fy=Math.max(0,Math.min(1-fh,centerY-fh/2));
  lerpVp(viewport,{sx:fx,sy:fy,sw:fw,sh:fh},0.15);
  lerpVp(smoothVp,viewport,getSmoothAlpha());
  updateFrameGuide({fx,fy,fw,fh});
}
function lerpVp(t,g,a){t.sx+=(g.sx-t.sx)*a;t.sy+=(g.sy-t.sy)*a;t.sw+=(g.sw-t.sw)*a;t.sh+=(g.sh-t.sh)*a;}
function getSmoothAlpha(){return +smoothSlider.value/100;}
function updateFrameGuide(rect){
  if(!rect||!aiMode||!subModes.autoframe){frameGuide.innerHTML='';return;}
  const W=canvas.width,H=canvas.height;
  const gx=((rect.fx-smoothVp.sx)/smoothVp.sw)*W, gy=((rect.fy-smoothVp.sy)/smoothVp.sh)*H;
  const gw=(rect.fw/smoothVp.sw)*W, gh=(rect.fh/smoothVp.sh)*H, cs=14;
  frameGuide.innerHTML=`
    <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" fill="none" stroke="rgba(212,176,63,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="${gx}" y1="${gy}" x2="${gx+cs}" y2="${gy}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+cs}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy}" x2="${gx+gw-cs}" y2="${gy}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy}" x2="${gx+gw}" y2="${gy+cs}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy+gh}" x2="${gx+cs}" y2="${gy+gh}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy+gh}" x2="${gx}" y2="${gy+gh-cs}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy+gh}" x2="${gx+gw-cs}" y2="${gy+gh}" stroke="#d4b03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh-cs}" stroke="#d4b03f" stroke-width="2"/>`;
}

// ═══════════════════════════════════════════
// POSE SKELETON
// ═══════════════════════════════════════════
const POSE_CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawPoseSkeleton(lms,W,H,sx,sy,sw,sh,vw,vh){
  const toC=lm=>({x:((lm.x*vw-sx)/sw)*W,y:((lm.y*vh-sy)/sh)*H,vis:lm.visibility});
  ctx.strokeStyle='rgba(78,173,112,0.65)'; ctx.lineWidth=1.5;
  POSE_CONN.forEach(([a,b])=>{
    const pa=toC(lms[a]),pb=toC(lms[b]);
    if(pa.vis<0.3||pb.vis<0.3)return;
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  });
  [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{
    const p=toC(lms[i]);if(p.vis<0.3)return;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle='#4ead70';ctx.fill();
  });
}

// ═══════════════════════════════════════════
// FACE CONTOUR
// ═══════════════════════════════════════════
const L_EYE=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const R_EYE=[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
const LIPS=[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
function drawFaceContour(lms,W,H,sx,sy,sw,sh,vw,vh){
  const toC=lm=>({x:((lm.x*vw-sx)/sw)*W,y:((lm.y*vh-sy)/sh)*H});
  [L_EYE,R_EYE].forEach(idx=>{
    ctx.beginPath();idx.forEach((i,n)=>{const p=toC(lms[i]);n===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.closePath();ctx.strokeStyle='rgba(163,125,179,0.6)';ctx.lineWidth=1;ctx.stroke();
  });
  ctx.beginPath();LIPS.forEach((i,n)=>{const p=toC(lms[i]);n===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
  ctx.closePath();ctx.strokeStyle='rgba(163,125,179,0.5)';ctx.lineWidth=1;ctx.stroke();
}

// ═══════════════════════════════════════════
// SHUTTER CHANCE
// ═══════════════════════════════════════════
function evaluateShutterChance(){
  const now=performance.now();
  if(now-lastShotTs<SHOT_COOLDOWN)return;
  const threshold=+sensSlider.value/100;

  if(subModes.smile&&faceResults?.multiFaceLandmarks?.length){
    if(estimateSmileScore(faceResults.multiFaceLandmarks[0])>threshold){triggerShot('😊 笑顔検知！');return;}
  }
  if(subModes.still&&poseResults?.poseLandmarks){
    const lms=poseResults.poseLandmarks;
    const lw=lms[15],rw=lms[16];
    if(lw&&rw&&lw.visibility>0.5&&rw.visibility>0.5){
      wristHistory.push([lw.x,lw.y,rw.x,rw.y]);
      if(wristHistory.length>WRIST_HIST_LEN)wristHistory.shift();
      if(wristHistory.length===WRIST_HIST_LEN){
        const recent=motionAmount(wristHistory.slice(-5));
        const earlier=motionAmount(wristHistory.slice(0,10));
        if(earlier>0.015&&recent<0.004){
          if(!wasMoving)wasMoving=true;
          else{triggerShot('🏌 静止検知！');wasMoving=false;return;}
        }else if(earlier<0.005)wasMoving=false;
      }
    }
  }
  if(subModes.pose&&poseResults?.poseLandmarks){
    const lms=poseResults.poseLandmarks;
    const lw=lms[15],rw=lms[16],nose=lms[0];
    if(lw&&rw&&nose&&lw.visibility>0.6&&rw.visibility>0.6&&lw.y<nose.y-0.05&&rw.y<nose.y-0.05){
      triggerShot('🙌 ポーズ検知！');return;
    }
  }
}

function estimateSmileScore(lms){
  const tl=lms[13],bl=lms[14],lm=lms[61],rm=lms[291];
  const open=Math.abs(tl.y-bl.y), width=Math.abs(lm.x-rm.x);
  const ratio=open/(width+1e-6);
  const midY=(tl.y+bl.y)/2;
  const lift=Math.max(0,midY-(lm.y+rm.y)/2);
  return Math.min(1,lift*15+(1-ratio*3)*0.5);
}
function motionAmount(h){
  let t=0;
  for(let i=1;i<h.length;i++){const p=h[i-1],c=h[i];t+=Math.hypot(c[0]-p[0],c[1]-p[1])+Math.hypot(c[2]-p[2],c[3]-p[3]);}
  return t/Math.max(1,h.length-1);
}

// ═══════════════════════════════════════════
// TRIGGER: 静止写真 + クリップ動画
// ═══════════════════════════════════════════
function triggerShot(reason){
  const now=performance.now();
  lastShotTs=now;

  // フラッシュ
  shotFlash.style.opacity='0.9';
  setTimeout(()=>{shotFlash.style.opacity='0';},150);

  // HUD
  chanceHud.textContent='📸 '+reason;
  chanceHud.style.display='block';
  clearTimeout(chanceTimer);
  chanceTimer=setTimeout(()=>{chanceHud.style.display='none';},2500);

  // ★ 静止写真：カメラ実解像度で保存
  if(chkSaveStill.checked) saveHighResShot('auto');

  // ★ クリップ動画（循環バッファ + 後N秒）
  if(!clipInProgress) buildClipVideo(now);
}

// ═══════════════════════════════════════════
// ★ 高解像度静止写真保存
//   vid の実解像度でオフスクリーンcanvasを作成し
//   オートフレーミングのビューポートを適用して保存
// ═══════════════════════════════════════════
function saveHighResShot(badge){
  if(!vid.videoWidth)return;

  const vw=vid.videoWidth, vh=vid.videoHeight;
  // オートフレーミングのビューポート（正規化）→ 実ピクセル
  const srcX=smoothVp.sx*vw, srcY=smoothVp.sy*vh;
  const srcW=smoothVp.sw*vw, srcH=smoothVp.sh*vh;

  // ★ カメラ実解像度のオフスクリーンcanvas（縮小なし）
  const hiC=document.createElement('canvas');
  hiC.width  = Math.round(srcW);
  hiC.height = Math.round(srcH);
  const hiCtx=hiC.getContext('2d');

  // 映像を実解像度で描画
  hiCtx.save();
  if(isFrontCam){
    hiCtx.scale(-1,1);
    hiCtx.drawImage(vid,srcX,srcY,srcW,srcH,-hiC.width,0,hiC.width,hiC.height);
  }else{
    hiCtx.drawImage(vid,srcX,srcY,srcW,srcH,0,0,hiC.width,hiC.height);
  }
  hiCtx.restore();

  // 表示用canvasのオーバーレイを実解像度にスケールして重ねる
  const scX=hiC.width/canvas.width, scY=hiC.height/canvas.height;
  hiCtx.save();
  hiCtx.scale(scX,scY);
  hiCtx.drawImage(canvas,0,0);
  hiCtx.restore();

  // PNG保存（無劣化）
  hiC.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const ts=new Date().toISOString().replace(/[:.]/g,'-');
    const fname=`shot_${ts}.png`;
    // 自動ダウンロード
    const a=document.createElement('a');a.href=url;a.download=fname;a.click();
    // ギャラリー
    addGalleryItem('image', url, blob, fname, badge==='auto'?'badge-auto':'badge-shot', null);
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  },'image/png');
}

// ═══════════════════════════════════════════
// ★ クリップ動画生成（循環バッファ + 後N秒録画）
//   circChunks（前N秒のwebmチャンク）＋ 後N秒のリアルタイム録画を
//   1つのBlobに結合してギャラリーに1件追加
// ═══════════════════════════════════════════
function buildClipVideo(triggerTs){
  if(clipInProgress)return;
  clipInProgress=true;

  const preSec  = +preSlider.value;
  const postSec = +postSlider.value;
  const mime    = getBestMimeType();
  const ext     = mime.toLowerCase().includes('mp4') ? 'mp4' : 'webm';

  // 前N秒分のチャンクを抽出
  const cutoff = triggerTs - preSec*1000;
  const preBlobs = circChunks
    .filter(c=>c.ts>=cutoff)
    .map(c=>c.blob);

  bufStatus.textContent=`⏺ クリップ後${postSec}秒録画中...`;
  bufStatus.style.display='block';

  // 後N秒をリアルタイム録画
  const postBlobs=[];
  const postStream = canvas.captureStream(30);
  let postRec;
  try{ postRec=new MediaRecorder(postStream,{mimeType:mime}); }
  catch(e){ postRec=new MediaRecorder(postStream); }

  postRec.ondataavailable=e=>{if(e.data?.size>0)postBlobs.push(e.data);};
  postRec.onstop=()=>{
    // 前後のチャンクを結合して1本の動画に
    const allBlobs=[...preBlobs,...postBlobs];
    const finalBlob=new Blob(allBlobs,{type:mime});
    const url=URL.createObjectURL(finalBlob);
    const ts=new Date().toISOString().replace(/[:.]/g,'-');
    const fname=`clip_${ts}.${ext}`;

    addGalleryItem('video', url, finalBlob, fname, 'badge-clip', null);
    bufStatus.style.display='none';
    clipInProgress=false;
  };

  postRec.start(200);
  setTimeout(()=>{ postRec.stop(); }, postSec*1000);
}

// ═══════════════════════════════════════════
// STOP
// ═══════════════════════════════════════════
btnStop.onclick=()=>{
  isRunning=false;
  if(drawAnimId){cancelAnimationFrame(drawAnimId);drawAnimId=null;}
  if(mediaRecorder?.state==='recording')mediaRecorder.stop();
  stopCircRecorder();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  cocoDetections=[];poseResults=null;faceResults=null;circChunks=[];
  aiMode=false;btnAI.classList.remove('on');btnAI.textContent='🎬 AI OFF';
  aiHud.style.display='none';chanceHud.style.display='none';bufStatus.style.display='none';
  frameGuide.innerHTML='';
  btnStart.disabled=false;btnStop.disabled=true;
  btnShot.disabled=true;btnRec.disabled=true;btnRecStop.disabled=true;btnAI.disabled=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

// ═══════════════════════════════════════════
// ★ 手動SHOT（高解像度）
// ═══════════════════════════════════════════
btnShot.onclick=()=>{
  shotFlash.style.opacity='0.9';
  setTimeout(()=>{shotFlash.style.opacity='0';},150);
  saveHighResShot('manual');
};

// ═══════════════════════════════════════════
// ★ 手動REC（1本の動画としてギャラリーに追加）
// ═══════════════════════════════════════════
btnRec.onclick=()=>{
  recordedChunks=[];
  const mime = getBestMimeType();
  try{mediaRecorder=new MediaRecorder(canvas.captureStream(30),mime?{mimeType:mime}:{});}
  catch(e){mediaRecorder=new MediaRecorder(canvas.captureStream(30));}
  mediaRecorder.ondataavailable=e=>{if(e.data?.size>0)recordedChunks.push(e.data);};
  mediaRecorder.onstop=()=>{
    const m=mediaRecorder.mimeType||getBestMimeType()||'video/webm';
    const ext=m.includes('mp4')?'mp4':'webm';
    const blob=new Blob(recordedChunks,{type:m});
    const url=URL.createObjectURL(blob);
    const ts=new Date().toISOString().replace(/[:.]/g,'-');
    addGalleryItem('video',url,blob,`rec_${ts}.${ext}`,'badge-rec',null);
  };
  mediaRecorder.start(100);
  btnRec.disabled=true;btnRecStop.disabled=false;
  btnRec.classList.add('recording');
  recHud.style.display='block';
};

btnRecStop.onclick=()=>{
  mediaRecorder.stop();
  btnRec.disabled=false;btnRecStop.disabled=true;
  btnRec.classList.remove('recording');
  recHud.style.display='none';
};

// ═══════════════════════════════════════════
// ★ ギャラリー（写真は画像表示、動画はサムネイル＋タップでプレイヤー）
// ═══════════════════════════════════════════
let galleryCount=0;
function addGalleryItem(type, url, blob, fname, badgeClass, _unused){
  galleryCount++;
  document.getElementById('galleryCount').textContent=`(${galleryCount})`;

  const item=document.createElement('div');
  item.className='gallery-item';

  const badge=document.createElement('div');
  badge.className='badge '+badgeClass;
  badge.textContent=badgeClass==='badge-auto'?'AI':badgeClass==='badge-clip'?'CLIP':badgeClass==='badge-shot'?'SHOT':'REC';
  item.appendChild(badge);

  if(type==='image'){
    const img=document.createElement('img'); img.src=url; item.appendChild(img);
  } else {
    // ★ 動画：サムネイル用videoタグ（操作不可）+ 再生アイコン
    item.classList.add('gallery-item-video');
    const thumb=document.createElement('video');
    thumb.className='gallery-thumb-video';
    thumb.src=url; thumb.muted=true; thumb.playsInline=true;
    thumb.currentTime=0.5; // サムネイルフレーム
    item.appendChild(thumb);

    const overlay=document.createElement('div'); overlay.className='play-overlay';
    const icon=document.createElement('div');    icon.className='play-icon'; icon.textContent='▶';
    overlay.appendChild(icon); item.appendChild(overlay);

    // タップ → プレイヤーモーダル
    item.addEventListener('click', e=>{ if(e.target.classList.contains('dl-btn'))return; openPlayer(url); });
  }

  const dl=document.createElement('button'); dl.className='dl-btn'; dl.textContent='↓';
  dl.onclick=e=>{
    e.stopPropagation();
    const a=document.createElement('a');
    a.href=blob?URL.createObjectURL(blob):url; a.download=fname; a.click();
  };
  item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
}

// ═══════════════════════════════════════════
// ★ 動画プレイヤーモーダル
// ═══════════════════════════════════════════
function openPlayer(url){
  playerVideo.src=url;
  playerVideo.load();
  playerVideo.play();
  setSpeed(1);
  playerModal.classList.add('open');
}

function setSpeed(rate){
  playerVideo.playbackRate=rate;
  document.getElementById('playerSpeedLabel').textContent=rate+'x';
  document.querySelectorAll('.player-speed-row button[data-rate]').forEach(b=>{
    b.classList.toggle('active', +b.dataset.rate===rate);
  });
}

document.querySelectorAll('.player-speed-row button[data-rate]').forEach(b=>{
  b.addEventListener('click',()=>setSpeed(+b.dataset.rate));
});

btnFramePrev.onclick=()=>{
  playerVideo.pause();
  playerVideo.currentTime=Math.max(0,playerVideo.currentTime-1/30);
};
btnFrameNext.onclick=()=>{
  playerVideo.pause();
  playerVideo.currentTime=Math.min(playerVideo.duration||0,playerVideo.currentTime+1/30);
};
playerClose.onclick=()=>{
  playerVideo.pause(); playerVideo.src='';
  playerModal.classList.remove('open');
};
playerModal.addEventListener('click',e=>{ if(e.target===playerModal)playerClose.click(); });
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Tracker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; color: #eee; font-family: 'Courier New', monospace; overflow-x: hidden; }

    /* ===== 縦向き：上に動画・下にコントロール ===== */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      align-items: stretch;
    }

    /* ----- 動画エリア（上） ----- */
    #video-area {
      position: relative;
      width: 100%;
      background: #000;
      flex-shrink: 0;
    }
    /* 縦向き：16:9 で固定 */
    #canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }
    #vid {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; pointer-events: none;
    }
    #canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    /* HUD */
    .hud { position: absolute; font-size: 10px; letter-spacing: 0.08em; pointer-events: none; }
    #fpsHud     { top: 8px; left: 10px; color: #555; }
    #recHud     { top: 8px; right: 10px; color: #9b59b6; display: none; }
    #zoomHud    { top: 8px; left: 50%; transform: translateX(-50%); color: #7dcea0; display: none; }
    #tapHud     { bottom: 28px; left: 50%; transform: translateX(-50%); color: #27ae60;
                  background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 20px;
                  display: none; white-space: nowrap; }
    #modelStatus{ bottom: 8px; left: 10px; color: #444; }

    /* ----- コントロールエリア（下） ----- */
    #ctrl-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== 横向き：動画を最大化、コントロールを右サイドバー ===== */
    @media (orientation: landscape) {
      #app { flex-direction: row; height: 100dvh; overflow: hidden; }

      #video-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #canvas-wrap {
        /* 横向きでは画面高さに合わせて最大化 */
        width: auto;
        height: 100dvh;
        aspect-ratio: 16/9;
      }

      #ctrl-area {
        width: 220px;
        flex: none;
        height: 100dvh;
        overflow-y: auto;
        padding: 10px 10px 20px;
        border-left: 1px solid #1a1a1a;
        gap: 6px;
      }
    }

    /* ===== コントロール共通 ===== */
    .section {
      background: #121212;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .section-title {
      font-size: 9px; color: #555; letter-spacing: 0.12em;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .btn-row {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }

    button {
      font-family: 'Courier New', monospace; font-size: 11px;
      padding: 6px 10px; border: 1px solid #333; border-radius: 6px;
      background: #1a1a1a; color: #bbb; cursor: pointer; transition: all 0.12s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #262626; color: #fff; }
    button:disabled { opacity: 0.35; cursor: default; }
    button.btn-start  { border-color: #27ae60; color: #2ecc71; }
    button.btn-start:hover:not(:disabled) { background: #0d2b18; }
    button.btn-stop   { border-color: #c0392b; color: #e74c3c; }
    button.btn-shot   { border-color: #2980b9; color: #5dade2; }
    button.btn-rec    { border-color: #8e44ad; color: #bb8fce; }
    button.btn-rec.recording { background: #8e44ad; color: #fff; animation: pulse 1.2s infinite; }
    button.btn-tap    { border-color: #1e8449; color: #58d68d; }
    button.btn-tap.on { background: #1a4a2a; color: #58d68d; border-color: #27ae60; }
    button.btn-clear  { border-color: #555; color: #888; font-size: 10px; padding: 4px 8px; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

    select {
      background: #1a1a1a; color: #ccc; border: 1px solid #333;
      border-radius: 4px; font-size: 11px; padding: 4px 6px;
      font-family: 'Courier New', monospace;
    }
    input[type=range] { accent-color: #27ae60; width: 100%; margin-top: 4px; }
    label.slider-label { font-size: 10px; color: #666; display: block; }

    /* ===== ターゲットチップ ===== */
    .target-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .target-chip {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 9px; border: 1px solid #2a2a2a; border-radius: 20px;
      font-size: 11px; color: #666; cursor: pointer;
      background: #141414; transition: all 0.12s; user-select: none;
    }
    .target-chip:hover { border-color: #444; color: #aaa; }
    .target-chip.on {
      border-color: var(--cc);
      color: var(--cc);
      background: color-mix(in srgb, var(--cc) 14%, #141414);
    }
    .chip-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cc, #888); opacity: 0.4; flex-shrink: 0;
    }
    .target-chip.on .chip-dot { opacity: 1; }

    /* ===== ズーム ===== */
    .zoom-row { display: flex; align-items: center; gap: 6px; }
    .zoom-lbl  { font-size: 11px; color: #7dcea0; min-width: 58px; }
    .zoom-btn  {
      width: 26px; height: 26px; border-radius: 50%; padding: 0;
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border-color: #2e7d52; color: #7dcea0;
    }
    .zoom-btn:hover:not(:disabled) { background: #1a2e22; }
    #zoomRange { flex: 1; accent-color: #27ae60; }
    #zoomModeLabel { font-size: 9px; color: #444; margin-top: 4px; }

    /* ===== ギャラリー ===== */
    #galleryGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px;
    }
    .gallery-item { border: 1px solid #222; border-radius: 6px; overflow: hidden; position: relative; }
    .gallery-item img, .gallery-item video { width: 100%; display: block; }
    .dl-btn {
      position: absolute; bottom: 3px; right: 3px;
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      background: rgba(0,0,0,0.8); border: 1px solid #444; color: #ccc; cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ========== 動画エリア（上 / 横向きなら左） ========== -->
  <div id="video-area">
    <div id="canvas-wrap">
      <video id="vid" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="hud" id="fpsHud">-- fps</div>
      <div class="hud" id="recHud">⏺ REC</div>
      <div class="hud" id="zoomHud">🔍 ×<span id="zoomHudVal">1.0</span></div>
      <div class="hud" id="tapHud">📐 タップして物体を選択</div>
      <div class="hud" id="modelStatus">AI MODEL: Loading...</div>
    </div>
  </div>

  <!-- ========== コントロールエリア（下 / 横向きなら右） ========== -->
  <div id="ctrl-area">

    <!-- カメラ操作 -->
    <div class="section">
      <div class="section-title">Camera</div>
      <select id="camSelect" style="width:100%; margin-bottom:6px;"><option>Loading...</option></select>
      <div class="btn-row">
        <button id="btnStart" class="btn-start">▶ START</button>
        <button id="btnStop"  class="btn-stop" disabled>■ STOP</button>
      </div>
    </div>

    <!-- 録画・撮影 -->
    <div class="section">
      <div class="section-title">Record / Shot</div>
      <div class="btn-row">
        <button id="btnShot"    class="btn-shot"  disabled>📷 SHOT</button>
        <button id="btnRec"     class="btn-rec"   disabled>⏺ REC</button>
        <button id="btnRecStop" class="btn-rec"   disabled>⏹ STOP</button>
      </div>
    </div>

    <!-- タップ選択 -->
    <div class="section">
      <div class="section-title">Tap Select</div>
      <div class="btn-row">
        <button id="btnTapMode" class="btn-tap" disabled>📐 タップ選択</button>
        <button id="btnClearTap" class="btn-clear" disabled>✕ 解除</button>
      </div>
    </div>

    <!-- ズーム -->
    <div class="section" id="zoomPanel" style="display:none;">
      <div class="section-title">Zoom</div>
      <div class="zoom-row">
        <span class="zoom-lbl">×<span id="zoomVal">1.0</span></span>
        <button class="zoom-btn" id="btnZoomOut">−</button>
        <input type="range" id="zoomRange" min="100" max="800" value="100">
        <button class="zoom-btn" id="btnZoomIn">+</button>
        <button style="font-size:9px;padding:3px 7px;" id="btnZoomReset">RST</button>
      </div>
      <div id="zoomModeLabel"></div>
    </div>

    <!-- 追跡対象（録画中も変更可） -->
    <div class="section">
      <div class="section-title">Tracking Targets（録画中も変更可）</div>
      <div class="target-grid" id="targetGrid"></div>
    </div>

    <!-- 設定 -->
    <div class="section">
      <div class="section-title">Settings</div>
      <label class="slider-label">カラー検出色
        <select id="ballColor" style="margin-top:4px; width:100%;">
          <option value="none">なし</option>
          <option value="white">白</option>
          <option value="orange">オレンジ</option>
          <option value="yellow">黄色</option>
          <option value="red">赤</option>
        </select>
      </label>
      <label class="slider-label" style="margin-top:8px;">
        軌跡の長さ：<span id="trailVal">60</span>
        <input type="range" id="trail" min="5" max="150" value="60">
      </label>
    </div>

    <!-- ギャラリー -->
    <div class="section">
      <div class="section-title">Gallery</div>
      <div id="galleryGrid"></div>
    </div>

  </div><!-- /ctrl-area -->
</div><!-- /app -->

<script>
// =====================================================
// DOM refs
// =====================================================
const vid           = document.getElementById('vid');
const canvas        = document.getElementById('canvas');
const ctx           = canvas.getContext('2d');
const camSelect     = document.getElementById('camSelect');
const ballColorSel  = document.getElementById('ballColor');
const btnStart      = document.getElementById('btnStart');
const btnStop       = document.getElementById('btnStop');
const btnShot       = document.getElementById('btnShot');
const btnRec        = document.getElementById('btnRec');
const btnRecStop    = document.getElementById('btnRecStop');
const btnTapMode    = document.getElementById('btnTapMode');
const btnClearTap   = document.getElementById('btnClearTap');
const zoomRange     = document.getElementById('zoomRange');
const zoomPanel     = document.getElementById('zoomPanel');
const zoomHud       = document.getElementById('zoomHud');
const zoomHudVal    = document.getElementById('zoomHudVal');
const trailSlider   = document.getElementById('trail');
const trailValEl    = document.getElementById('trailVal');
const modelStatus   = document.getElementById('modelStatus');
const fpsHud        = document.getElementById('fpsHud');
const canvasWrap    = document.getElementById('canvas-wrap');
const tapHud        = document.getElementById('tapHud');

// =====================================================
// 追跡対象定義
// =====================================================
const ALL_TARGETS = [
  { key:'person',        label:'人',           color:'#e74c3c' },
  { key:'car',           label:'車',           color:'#e67e22' },
  { key:'bicycle',       label:'自転車',       color:'#f1c40f' },
  { key:'motorcycle',    label:'バイク',       color:'#e67e22' },
  { key:'bus',           label:'バス',         color:'#e74c3c' },
  { key:'truck',         label:'トラック',     color:'#c0392b' },
  { key:'sports ball',   label:'ボール(AI)',   color:'#2ecc71' },
  { key:'golf club',     label:'ゴルフクラブ', color:'#1abc9c' },
  { key:'tennis racket', label:'ラケット',     color:'#3498db' },
  { key:'cat',           label:'猫',           color:'#9b59b6' },
  { key:'dog',           label:'犬',           color:'#8e44ad' },
  { key:'bird',          label:'鳥',           color:'#1abc9c' },
  { key:'cell phone',    label:'スマホ',       color:'#95a5a6' },
  { key:'bottle',        label:'ボトル',       color:'#27ae60' },
  { key:'COLOR_BALL',    label:'カラーボール', color:'#ffff00' },
];
const DEFAULT_ON  = new Set(['person','sports ball','COLOR_BALL']);
let activeTargets = new Set(DEFAULT_ON);

// チップ生成（録画中も activeTargets を即更新するだけでOK）
const targetGrid = document.getElementById('targetGrid');
ALL_TARGETS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'target-chip' + (activeTargets.has(t.key) ? ' on' : '');
  chip.style.setProperty('--cc', t.color);
  chip.dataset.key = t.key;
  chip.innerHTML = `<span class="chip-dot"></span>${t.label}`;
  chip.addEventListener('click', () => {
    // 録画中・停止中どちらでも即切り替え
    if (activeTargets.has(t.key)) {
      activeTargets.delete(t.key);
      chip.classList.remove('on');
      // 無効になったクラスの軌跡を即削除
      Object.keys(trails).forEach(id => {
        if (id.startsWith(t.key + '_') && !id.startsWith('pinned_')) delete trails[id];
      });
    } else {
      activeTargets.add(t.key);
      chip.classList.add('on');
    }
  });
  targetGrid.appendChild(chip);
});

function getTargetInfo(key) { return ALL_TARGETS.find(t => t.key === key); }
trailSlider.addEventListener('input', () => { trailValEl.textContent = trailSlider.value; });

// =====================================================
// State
// =====================================================
let model         = null;
let stream        = null;
let drawAnimId    = null;
let isRunning     = false;
let zoomLevel     = 1.0;
let currentTrack  = null;
let nativeZoom    = false;
let isFrontCamera = false;
let mediaRecorder  = null;
let recordedChunks = [];
let detections = [];
let trails     = {};
let fpsFrames = 0, fpsLast = performance.now();

// タップ選択
let tapModeActive  = false;
let pinnedTargets  = [];
let tapRipples     = [];

// =====================================================
// canvas サイズ同期
// =====================================================
function syncCanvasSize() {
  const rect = canvasWrap.getBoundingClientRect();
  const W = Math.round(rect.width);
  const H = Math.round(rect.height);
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W; canvas.height = H;
  }
  return { W, H };
}
new ResizeObserver(() => { if (isRunning) syncCanvasSize(); }).observe(canvasWrap);

// =====================================================
// 初期化
// =====================================================
async function init() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cams.sort((a,b) => /back|rear|environment/i.test(b.label) - /back|rear|environment/i.test(a.label));
    camSelect.innerHTML = cams.map(d =>
      `<option value="${d.deviceId}">${d.label||'Camera '+d.deviceId.slice(0,4)}</option>`
    ).join('');
    modelStatus.textContent = 'AI MODEL: Loading...';
    model = await cocoSsd.load();
    modelStatus.textContent = 'AI MODEL: Ready ✓';
  } catch(e) { modelStatus.textContent = 'AI MODEL: Error'; }
}
init();

// =====================================================
// カメラ起動
// =====================================================
btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  trails = {}; detections = []; pinnedTargets = []; tapRipples = [];

  try {
    let constraints = { video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} } };
    if (camSelect.value && !/Loading/.test(camSelect.value))
      constraints = { video:{ deviceId:{exact:camSelect.value}, width:{ideal:1280}, height:{ideal:720} } };

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream; await vid.play();

    currentTrack = stream.getVideoTracks()[0];
    const settings = currentTrack.getSettings();
    isFrontCamera = settings.facingMode==='user' || (currentTrack.label||'').toLowerCase().includes('front');

    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (caps.zoom) {
      nativeZoom = true;
      zoomRange.min = Math.round((caps.zoom.min||1)*100);
      zoomRange.max = Math.round((caps.zoom.max||8)*100);
      document.getElementById('zoomModeLabel').textContent = 'ネイティブズーム（光学）';
      document.getElementById('zoomModeLabel').style.color = '#27ae60';
    } else {
      nativeZoom = false; zoomRange.min=100; zoomRange.max=800;
      document.getElementById('zoomModeLabel').textContent = 'デジタルズーム';
      document.getElementById('zoomModeLabel').style.color = '#555';
    }
    zoomRange.value=100; applyZoom(1.0);
    zoomPanel.style.display='block';

    btnStart.disabled=true; btnStop.disabled=false;
    btnShot.disabled=false; btnRec.disabled=false;
    btnTapMode.disabled=false; btnClearTap.disabled=false;

    isRunning=true; fpsLast=performance.now(); fpsFrames=0;
    syncCanvasSize();
    drawLoop(); detectionLoop();
  } catch(e) { alert('Camera Error: '+e.message); }
};

// =====================================================
// 描画ループ（毎フレーム・映像は止めない）
// =====================================================
function drawLoop() {
  if (!isRunning) return;
  const {W,H} = syncCanvasSize();
  if (!vid.videoWidth) { drawAnimId=requestAnimationFrame(drawLoop); return; }

  // 映像描画（デジタルズーム）
  const dz = nativeZoom ? 1.0 : zoomLevel;
  const sw=vid.videoWidth/dz, sh=vid.videoHeight/dz;
  const sx=(vid.videoWidth-sw)/2, sy=(vid.videoHeight-sh)/2;
  ctx.save();
  if (isFrontCamera) { ctx.scale(-1,1); ctx.drawImage(vid,sx,sy,sw,sh,-W,0,W,H); }
  else               { ctx.drawImage(vid,sx,sy,sw,sh,0,0,W,H); }
  ctx.restore();

  const maxLen = +trailSlider.value;
  const now = performance.now();

  // ---- タップ選択モード ----
  if (tapModeActive && pinnedTargets.length>0) {
    // pinnedTargets を最新 detections で追従
    pinnedTargets.forEach(pt => {
      let best=null, bestDist=100;
      detections.forEach(det => {
        if (det.classKey!==pt.classKey) return;
        const d=Math.hypot(det.cx-(pt.bbox[0]+pt.bbox[2]/2), det.cy-(pt.bbox[1]+pt.bbox[3]/2));
        if (d<bestDist){bestDist=d;best=det;}
      });
      if (best) {
        pt.bbox=[...best.bbox];
        updateTrail(pt.trailId, best.cx, best.cy, maxLen);
      }
    });

    pinnedTargets.forEach(pt => {
      const [bx,by,bw,bh]=pt.bbox;
      const cx=bx+bw/2, cy=by+bh/2;
      // 枠（太め）
      ctx.strokeStyle=pt.color; ctx.lineWidth=2.5; ctx.setLineDash([]);
      ctx.strokeRect(bx,by,bw,bh);
      // 四隅Lマーカー
      const cs=12;
      ctx.lineWidth=3;
      [[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]].forEach(([ox,oy])=>{
        const dx=ox===bx?1:-1, dy=oy===by?1:-1;
        ctx.beginPath(); ctx.moveTo(ox+dx*cs,oy); ctx.lineTo(ox,oy); ctx.lineTo(ox,oy+dy*cs); ctx.stroke();
      });
      // ラベル
      ctx.font='bold 12px Courier New';
      const txt='◆ '+pt.label;
      const tw=ctx.measureText(txt).width+8;
      ctx.fillStyle=pt.color; ctx.fillRect(bx,by-18,tw,18);
      ctx.fillStyle='#000'; ctx.fillText(txt,bx+4,by-4);
      // 軌跡＋中心点
      drawTrailLines(pt.trailId, pt.color);
      drawCenterDot(cx, cy, pt.color);
    });

    // 非選択物体は薄い点線枠
    detections.forEach(det => {
      const isPinned=pinnedTargets.some(p=>p.classKey===det.classKey &&
        Math.hypot(p.bbox[0]+p.bbox[2]/2-det.cx, p.bbox[1]+p.bbox[3]/2-det.cy)<60);
      if (!isPinned && activeTargets.has(det.classKey)) {
        const ti=getTargetInfo(det.classKey); if(!ti) return;
        ctx.strokeStyle=hexAlpha(ti.color,0.22); ctx.lineWidth=1;
        ctx.setLineDash([4,4]); ctx.strokeRect(det.bbox[0],det.bbox[1],det.bbox[2],det.bbox[3]);
        ctx.setLineDash([]);
      }
    });

  } else {
    // ---- 通常モード：activeTargets を全描画 ----

    // カラーボール
    if (activeTargets.has('COLOR_BALL') && ballColorSel.value!=='none') {
      const cb=detectBallByColor(W,H);
      if (cb) {
        updateTrail('COLOR_BALL_0',cb.x,cb.y,maxLen);
        const ti=getTargetInfo('COLOR_BALL');
        drawBox(cb.x-15,cb.y-15,30,30,ti.color,'カラーボール',1.0);
        drawTrailLines('COLOR_BALL_0',ti.color);
        drawCenterDot(cb.x,cb.y,ti.color);
      }
    }

    const usedIds=new Set();
    detections.forEach((det,idx)=>{
      if (!activeTargets.has(det.classKey)) return;
      const ti=getTargetInfo(det.classKey); if(!ti) return;
      const trailId=matchOrCreateTrail(det.classKey,det.cx,det.cy,idx);
      usedIds.add(trailId);
      updateTrail(trailId,det.cx,det.cy,maxLen);
      drawBox(det.bbox[0],det.bbox[1],det.bbox[2],det.bbox[3],ti.color,ti.label,det.score);
      drawTrailLines(trailId,ti.color);
      drawCenterDot(det.cx,det.cy,ti.color);
    });

    // 古い軌跡を掃除
    Object.keys(trails).forEach(id=>{
      if (id.startsWith('pinned_')||id.startsWith('COLOR_BALL')) return;
      if (!usedIds.has(id)) {
        trails[id].age=(trails[id].age||0)+1;
        if(trails[id].age>30) delete trails[id];
      }
    });
  }

  // リップル
  const RDUR=600;
  tapRipples=tapRipples.filter(r=>now-r.t<RDUR);
  tapRipples.forEach(r=>{
    const prog=(now-r.t)/RDUR, rad=20+prog*30, alpha=1-prog;
    ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,Math.PI*2);
    ctx.strokeStyle=hexAlpha(r.color,alpha); ctx.lineWidth=2; ctx.stroke();
    if(!r.miss&&!r.remove){
      ctx.beginPath(); ctx.arc(r.x,r.y,rad*0.4,0,Math.PI*2);
      ctx.fillStyle=hexAlpha(r.color,alpha*0.5); ctx.fill();
    }
  });

  // タップHUD
  if (tapModeActive) {
    tapHud.style.display='block';
    tapHud.textContent = pinnedTargets.length===0
      ? '📐 タップして追跡する物体を選択'
      : `📐 ${pinnedTargets.length}件選択中（再タップで解除）`;
  }

  // FPS
  fpsFrames++;
  const n=performance.now();
  if(n-fpsLast>1000){
    fpsHud.textContent=Math.round(fpsFrames/((n-fpsLast)/1000))+' fps';
    fpsFrames=0; fpsLast=n;
  }

  drawAnimId=requestAnimationFrame(drawLoop);
}

// =====================================================
// AI 検出ループ（描画と独立）
// =====================================================
async function detectionLoop() {
  if (!isRunning) return;
  if (!model||!vid.videoWidth){setTimeout(detectionLoop,100);return;}

  try {
    const ow=320,oh=240;
    const off=document.createElement('canvas'); off.width=ow; off.height=oh;
    const oc=off.getContext('2d');
    const dz=nativeZoom?1.0:zoomLevel;
    const sw=vid.videoWidth/dz, sh=vid.videoHeight/dz;
    const sx=(vid.videoWidth-sw)/2, sy=(vid.videoHeight-sh)/2;
    if(isFrontCamera){oc.save();oc.scale(-1,1);oc.drawImage(vid,sx,sy,sw,sh,-ow,0,ow,oh);oc.restore();}
    else{oc.drawImage(vid,sx,sy,sw,sh,0,0,ow,oh);}

    const preds=await model.detect(off);
    const W=canvas.width, H=canvas.height;
    const scaleX=W/ow, scaleY=H/oh;

    // activeTargets ＋ pinnedTargets のクラスを全て検出対象に（変更が即反映される）
    const neededKeys = new Set([...activeTargets, ...pinnedTargets.map(p=>p.classKey)]);

    detections=preds
      .filter(p=>neededKeys.has(p.class))
      .map(p=>{
        const bx=p.bbox[0]*scaleX, by=p.bbox[1]*scaleY;
        const bw=p.bbox[2]*scaleX, bh=p.bbox[3]*scaleY;
        return {classKey:p.class,bbox:[bx,by,bw,bh],cx:bx+bw/2,cy:by+bh/2,score:p.score};
      });
  } catch(e){console.warn('detection error',e);}

  if(isRunning) setTimeout(detectionLoop,0);
}

// =====================================================
// タップ選択
// =====================================================
btnTapMode.onclick = ()=>{
  tapModeActive=!tapModeActive;
  if(tapModeActive){
    btnTapMode.classList.add('on');
    btnTapMode.textContent='📐 タップ選択 ON';
    canvasWrap.style.cursor='crosshair';
    tapHud.style.display='block';
  } else {
    btnTapMode.classList.remove('on');
    btnTapMode.textContent='📐 タップ選択';
    canvasWrap.style.cursor='';
    tapHud.style.display='none';
  }
};
btnClearTap.onclick = ()=>{ pinnedTargets=[]; tapRipples=[]; };

function handleCanvasTap(clientX,clientY){
  if(!tapModeActive||!isRunning) return;
  const rect=canvas.getBoundingClientRect();
  const cx=(clientX-rect.left)*(canvas.width/rect.width);
  const cy=(clientY-rect.top)*(canvas.height/rect.height);

  let hit=null;
  for(const det of detections){
    const [bx,by,bw,bh]=det.bbox;
    if(cx>=bx&&cx<=bx+bw&&cy>=by&&cy<=by+bh){hit=det;break;}
  }

  if(hit){
    const ti=getTargetInfo(hit.classKey);
    const color=ti?ti.color:'#00ffff';
    const label=ti?ti.label:hit.classKey;
    const existIdx=pinnedTargets.findIndex(p=>
      Math.hypot(p.bbox[0]+p.bbox[2]/2-(hit.bbox[0]+hit.bbox[2]/2),
                 p.bbox[1]+p.bbox[3]/2-(hit.bbox[1]+hit.bbox[3]/2))<60
    );
    if(existIdx>=0){
      const removed=pinnedTargets.splice(existIdx,1)[0];
      delete trails[removed.trailId];
      tapRipples.push({x:cx,y:cy,t:performance.now(),color:'#888',remove:true});
    } else {
      const trailId='pinned_'+Date.now();
      trails[trailId]={pts:[],age:0,pinned:true};
      pinnedTargets.push({trailId,classKey:hit.classKey,color,label,bbox:[...hit.bbox]});
      tapRipples.push({x:cx,y:cy,t:performance.now(),color});
    }
  } else {
    tapRipples.push({x:cx,y:cy,t:performance.now(),color:'#555',miss:true});
  }
}

canvasWrap.addEventListener('click',e=>{ if(!e._fromTouch) handleCanvasTap(e.clientX,e.clientY); });
canvasWrap.addEventListener('touchend',e=>{
  if(!tapModeActive) return;
  if(e.changedTouches.length===1){
    const t=e.changedTouches[0];
    const ev=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY});
    ev._fromTouch=false;
    handleCanvasTap(t.clientX,t.clientY);
    e.preventDefault();
  }
},{passive:false});

// =====================================================
// 軌跡ユーティリティ
// =====================================================
function matchOrCreateTrail(classKey,cx,cy,idx){
  let bestId=null,bestDist=120;
  Object.keys(trails).forEach(id=>{
    if(!id.startsWith(classKey+'_')||id.startsWith('pinned_')) return;
    const pts=trails[id].pts; if(!pts||pts.length===0) return;
    const last=pts[pts.length-1];
    const d=Math.hypot(cx-last.x,cy-last.y);
    if(d<bestDist){bestDist=d;bestId=id;}
  });
  if(bestId){trails[bestId].age=0;return bestId;}
  const newId=classKey+'_'+Date.now()+'_'+idx;
  trails[newId]={pts:[],age:0}; return newId;
}
function updateTrail(id,cx,cy,maxLen){
  if(!trails[id]) trails[id]={pts:[],age:0};
  trails[id].pts.push({x:cx,y:cy});
  if(maxLen&&trails[id].pts.length>maxLen) trails[id].pts.shift();
  trails[id].age=0;
}
function drawTrailLines(id,color){
  const entry=trails[id]; if(!entry) return;
  const pts=entry.pts; if(pts.length<2) return;
  for(let i=1;i<pts.length;i++){
    const alpha=i/pts.length;
    ctx.beginPath(); ctx.moveTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=hexAlpha(color,alpha*0.9); ctx.lineWidth=1+alpha*3;
    ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  }
}
function drawCenterDot(cx,cy,color){
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,11,0,Math.PI*2);
  ctx.strokeStyle=hexAlpha(color,0.4); ctx.lineWidth=1.5; ctx.stroke();
}
function drawBox(bx,by,bw,bh,color,label,score){
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash([]); ctx.strokeRect(bx,by,bw,bh);
  const cx=bx+bw/2,cy=by+bh/2;
  ctx.strokeStyle=hexAlpha(color,0.5); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-8,cy); ctx.lineTo(cx+8,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-8); ctx.lineTo(cx,cy+8); ctx.stroke();
  ctx.font='bold 11px Courier New';
  const txt=label+(score<1?' '+Math.round(score*100)+'%':'');
  const tw=ctx.measureText(txt).width+8;
  ctx.fillStyle=color; ctx.fillRect(bx,by-16,tw,16);
  ctx.fillStyle='#000'; ctx.fillText(txt,bx+4,by-4);
}
function hexAlpha(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// =====================================================
// カラーボール
// =====================================================
function detectBallByColor(W,H){
  if(!vid.videoWidth) return null;
  const ow=160,oh=120;
  const off=document.createElement('canvas'); off.width=ow; off.height=oh;
  off.getContext('2d').drawImage(vid,0,0,ow,oh);
  const data=off.getContext('2d').getImageData(0,0,ow,oh).data;
  const target=ballColorSel.value;
  let sx=0,sy=0,cnt=0;
  for(let y=0;y<oh;y+=2){for(let x=0;x<ow;x+=2){
    const i=(y*ow+x)*4; const r=data[i],g=data[i+1],b=data[i+2]; let m=false;
    if(target==='white'  &&r>210&&g>210&&b>210) m=true;
    if(target==='orange' &&r>200&&g>90&&g<170&&b<80) m=true;
    if(target==='yellow' &&r>200&&g>200&&b<100) m=true;
    if(target==='red'    &&r>160&&g<80&&b<80) m=true;
    if(m){sx+=x;sy+=y;cnt++;}
  }}
  if(cnt<5) return null;
  return{x:(sx/cnt)/ow*W, y:(sy/cnt)/oh*H};
}

// =====================================================
// ズーム
// =====================================================
function applyZoom(v){
  v=Math.max(1.0,Math.min(8.0,v)); zoomLevel=v;
  const d=v.toFixed(1);
  document.getElementById('zoomVal').textContent=d;
  zoomHudVal.textContent=d; zoomRange.value=Math.round(v*100);
  zoomHud.style.display=v>1.0?'block':'none';
  if(nativeZoom&&currentTrack){try{currentTrack.applyConstraints({advanced:[{zoom:v}]});}catch(e){}}
}
zoomRange.addEventListener('input',()=>applyZoom(+zoomRange.value/100));
document.getElementById('btnZoomIn').onclick    =()=>applyZoom(zoomLevel+0.5);
document.getElementById('btnZoomOut').onclick   =()=>applyZoom(zoomLevel-0.5);
document.getElementById('btnZoomReset').onclick =()=>applyZoom(1.0);

// ピンチズーム（2本指のみ）
let lastPinch=null;
canvasWrap.addEventListener('touchstart',e=>{if(e.touches.length===2)lastPinch=pDist(e.touches);},{passive:true});
canvasWrap.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&lastPinch){const d=pDist(e.touches);applyZoom(zoomLevel+(d-lastPinch)/200);lastPinch=d;}
},{passive:true});
canvasWrap.addEventListener('touchend',e=>{if(e.touches.length<2)lastPinch=null;});
function pDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}

// =====================================================
// 停止
// =====================================================
btnStop.onclick=()=>{
  isRunning=false;
  if(drawAnimId){cancelAnimationFrame(drawAnimId);drawAnimId=null;}
  if(mediaRecorder?.state==='recording') mediaRecorder.stop();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  currentTrack=null; detections=[]; trails={}; pinnedTargets=[]; tapRipples=[];
  zoomPanel.style.display='none'; zoomHud.style.display='none';
  tapHud.style.display='none'; tapModeActive=false;
  btnTapMode.classList.remove('on'); btnTapMode.textContent='📐 タップ選択';
  canvasWrap.style.cursor='';
  btnStart.disabled=false; btnStop.disabled=true;
  btnShot.disabled=true; btnRec.disabled=true; btnRecStop.disabled=true;
  btnTapMode.disabled=true; btnClearTap.disabled=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

// =====================================================
// スクリーンショット・録画
// =====================================================
btnShot.onclick=()=>{
  const dataUrl=canvas.toDataURL('image/png');
  const a=document.createElement('a'); a.href=dataUrl; a.download='shot_'+Date.now()+'.png'; a.click();
  addGallery('image',dataUrl,null,dataUrl);
};

btnRec.onclick=()=>{
  recordedChunks=[];
  const mimeType=['video/mp4','video/webm;codecs=h264','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  try{mediaRecorder=new MediaRecorder(canvas.captureStream(30),mimeType?{mimeType}:{});}
  catch(e){mediaRecorder=new MediaRecorder(canvas.captureStream(30));}
  mediaRecorder.ondataavailable=e=>{if(e.data?.size>0)recordedChunks.push(e.data);};
  mediaRecorder.onstop=()=>{
    const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'video/webm'});
    const url=URL.createObjectURL(blob);
    const ext=(mediaRecorder.mimeType||'').includes('mp4')?'mp4':'webm';
    addGallery('video',url,blob,'rec_'+Date.now()+'.'+ext);
  };
  mediaRecorder.start(100);
  btnRec.disabled=true; btnRecStop.disabled=false;
  btnRec.classList.add('recording');
  document.getElementById('recHud').style.display='block';
};

btnRecStop.onclick=()=>{
  mediaRecorder.stop();
  btnRec.disabled=false; btnRecStop.disabled=true;
  btnRec.classList.remove('recording');
  document.getElementById('recHud').style.display='none';
};

function addGallery(type,url,blob,filename){
  const item=document.createElement('div'); item.className='gallery-item';
  if(type==='image'){
    const img=document.createElement('img'); img.src=url; item.appendChild(img);
  } else {
    const v=document.createElement('video'); v.src=url; v.controls=true; v.loop=true; item.appendChild(v);
  }
  const dl=document.createElement('button'); dl.className='dl-btn'; dl.textContent='↓';
  dl.onclick=()=>{
    const a=document.createElement('a');
    a.href=blob?URL.createObjectURL(blob):url;
    a.download=filename; a.click();
  };
  item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
}
</script>

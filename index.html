<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & Color Tracker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f; color: #eee;
      font-family: 'Courier New', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px;
    }
    h1 { font-size: 16px; letter-spacing: 0.15em; color: #ff4444; margin-bottom: 14px; text-transform: uppercase; }

    .control-row {
      display: flex; gap: 8px; margin-bottom: 8px;
      align-items: center; flex-wrap: wrap;
      justify-content: center; width: 100%; max-width: 720px;
    }
    button {
      font-family: 'Courier New', monospace; font-size: 11px;
      padding: 6px 12px; border: 1px solid #444; border-radius: 6px;
      background: #1a1a1a; color: #ccc; cursor: pointer; transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: #2a2a2a; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.active-rec { background: #8e44ad; color: #fff; border-color: #9b59b6; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    select { background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 4px; font-size: 11px; padding: 4px 6px; }
    input[type=range] { accent-color: #27ae60; }

    /* ---- 追跡対象セレクター ---- */
    #targetPanel {
      width: 100%; max-width: 720px;
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
    }
    #targetPanel .panel-title { font-size: 10px; color: #666; letter-spacing: 0.1em; margin-bottom: 8px; }
    .target-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .target-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border: 1px solid #333; border-radius: 20px;
      font-size: 11px; color: #888; cursor: pointer;
      background: #1a1a1a; transition: all 0.15s; user-select: none;
    }
    .target-chip:hover { border-color: #555; color: #bbb; }
    .target-chip.on {
      border-color: var(--chip-color, #ff4444);
      color: var(--chip-color, #ff4444);
      background: color-mix(in srgb, var(--chip-color, #ff4444) 12%, #1a1a1a);
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chip-color, #ff4444); opacity: 0.5; }
    .target-chip.on .chip-dot { opacity: 1; }

    /* ---- ズームUI ---- */
    #zoomPanel {
      width: 100%; max-width: 720px;
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; display: none;
    }
    #zoomPanel.visible { display: block; }
    .zoom-row { display: flex; align-items: center; gap: 10px; }
    .zoom-label { font-size: 12px; color: #7dcea0; min-width: 72px; letter-spacing: 0.05em; }
    .zoom-btn {
      width: 30px; height: 30px; border-radius: 50%; padding: 0; font-size: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-color: #2e7d52; color: #7dcea0;
    }
    .zoom-btn:hover:not(:disabled) { background: #1a2e22; }
    #zoomRange { flex: 1; accent-color: #27ae60; }
    .zoom-reset { font-size: 10px; padding: 4px 10px; border-color: #2e7d52; color: #7dcea0; }
    .zoom-reset:hover:not(:disabled) { background: #1a2e22; }
    #zoomMode { font-size: 9px; color: #555; margin-top: 5px; }

    /* ---- Canvas ---- */
    #canvas-wrap {
      position: relative; border: 1px solid #2a2a2a;
      border-radius: 10px; overflow: hidden;
      width: 100%; max-width: 720px; aspect-ratio: 4/3; background: #111;
    }
    #vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #recHud { position: absolute; top: 10px; right: 12px; color: #9b59b6; display: none; font-size: 10px; letter-spacing: 0.08em; }
    #zoomHud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #7dcea0; letter-spacing: 0.08em; pointer-events: none; display: none; }
    #modelStatus { position: absolute; bottom: 10px; left: 12px; font-size: 9px; color: #555; pointer-events: none; }
    #fpsHud { position: absolute; top: 10px; left: 12px; font-size: 9px; color: #555; pointer-events: none; }
    #shotFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.05s; }

    /* ---- ギャラリー ---- */
    #gallery { margin-top: 16px; width: 100%; max-width: 720px; }
    #galleryTitle { font-size: 11px; color: #555; margin-bottom: 8px; letter-spacing: 0.08em; display: none; }
    #galleryGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .gallery-item { border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; position: relative; background: #111; }
    .gallery-item img { width: 100%; display: block; }
    .gallery-item video { width: 100%; display: block; }
    .dl-btn {
      position: absolute; bottom: 4px; right: 4px; font-size: 10px; padding: 2px 7px;
      border-radius: 4px; background: rgba(0,0,0,0.75); border: 1px solid #444; color: #ccc; cursor: pointer;
    }
    .type-badge {
      position: absolute; top: 4px; left: 4px;
      font-size: 9px; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.05em;
    }
    .badge-shot { background: rgba(41,128,185,0.85); color: #aee; }
    .badge-rec  { background: rgba(142,68,173,0.85); color: #dbd; }

    /* ---- 動画プレイヤーモーダル ---- */
    #playerModal {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.92); align-items: center; justify-content: center; padding: 16px;
    }
    #playerModal.open { display: flex; }
    #playerBox {
      background: #141414; border: 1px solid #333; border-radius: 12px; padding: 16px;
      width: 100%; max-width: 680px;
    }
    #playerBox h3 { font-size: 11px; color: #888; letter-spacing: 0.1em; margin-bottom: 10px; }
    #playerVideo { width: 100%; border-radius: 6px; background: #000; display: block; margin-bottom: 12px; }
    .player-ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .player-ctrl-row button { font-size: 11px; padding: 5px 10px; }
    .player-ctrl-row button.active { background: #2e7d52; color: #fff; border-color: #27ae60; }
    #playerSpeed { font-size: 11px; color: #7dcea0; min-width: 44px; }
    #playerClose { margin-left: auto; border-color: #555; color: #888; }
    #playerClose:hover { background: #2a2a2a; color: #fff; }
  </style>
</head>
<body>

<h1>&#9654; AI & Color Tracker Pro</h1>

<div class="control-row">
  <select id="camSelect"><option>Loading...</option></select>
  <button id="btnStart">START</button>
  <button id="btnStop" disabled>STOP</button>
  <button id="btnShot" disabled style="color:#5dade2; border-color:#2980b9;">&#128247; SHOT</button>
  <button id="btnRec" disabled>&#9210; REC</button>
  <button id="btnRecStop" disabled>&#9209; STOP</button>
</div>

<div class="control-row">
  <label style="font-size:10px; color:#888;">カラー検出色
    <select id="ballColor" style="margin-left:4px;">
      <option value="none">なし</option>
      <option value="white">白</option>
      <option value="orange">オレンジ</option>
      <option value="yellow">黄色</option>
      <option value="red">赤</option>
    </select>
  </label>
  <label style="font-size:10px; color:#888;">軌跡の長さ
    <input type="range" id="trail" min="5" max="150" value="60" style="margin-left:4px; width:80px;">
    <span id="trailVal" style="color:#aaa;">60</span>
  </label>
</div>

<div id="targetPanel">
  <div class="panel-title">TRACKING TARGETS ― クリックでON/OFF（複数選択可）</div>
  <div class="target-grid" id="targetGrid"></div>
</div>

<div id="zoomPanel">
  <div class="zoom-row">
    <span class="zoom-label">ZOOM &#215;<span id="zoomVal">1.0</span></span>
    <button class="zoom-btn" id="btnZoomOut">&#8722;</button>
    <input type="range" id="zoomRange" min="100" max="800" value="100">
    <button class="zoom-btn" id="btnZoomIn">&#43;</button>
    <button class="zoom-reset" id="btnZoomReset">RESET</button>
  </div>
  <div id="zoomMode"></div>
</div>

<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="recHud">&#9210; REC</div>
  <div id="zoomHud">&#128269; &#215;<span id="zoomHudVal">1.0</span></div>
  <div id="modelStatus">AI MODEL: Loading...</div>
  <div id="fpsHud">-- fps</div>
  <div id="shotFlash"></div>
</div>

<div id="gallery">
  <div id="galleryTitle">SAVED FILES</div>
  <div id="galleryGrid"></div>
</div>

<!-- ===== 動画プレイヤーモーダル ===== -->
<div id="playerModal">
  <div id="playerBox">
    <h3>&#9654; VIDEO PLAYER</h3>
    <video id="playerVideo" controls playsinline></video>
    <div class="player-ctrl-row">
      <button id="btn025x">&#xBC; x</button>
      <button id="btn05x">&#xBD; x</button>
      <button id="btn1x" class="active">1x</button>
      <button id="btn2x">2x</button>
      <span id="playerSpeed">1x</span>
    </div>
    <div class="player-ctrl-row">
      <button id="btnFramePrev">&#9664;&#9664; コマ戻し</button>
      <button id="btnFrameNext">コマ送り &#9654;&#9654;</button>
      <button id="playerClose">&#10005; 閉じる</button>
    </div>
  </div>
</div>

<script>
// =====================================================
// DOM refs
// =====================================================
const vid          = document.getElementById('vid');
const canvas       = document.getElementById('canvas');
const ctx          = canvas.getContext('2d');
const camSelect    = document.getElementById('camSelect');
const ballColorSel = document.getElementById('ballColor');
const btnStart     = document.getElementById('btnStart');
const btnStop      = document.getElementById('btnStop');
const btnShot      = document.getElementById('btnShot');
const btnRec       = document.getElementById('btnRec');
const btnRecStop   = document.getElementById('btnRecStop');
const zoomRange    = document.getElementById('zoomRange');
const zoomPanel    = document.getElementById('zoomPanel');
const zoomHud      = document.getElementById('zoomHud');
const zoomHudVal   = document.getElementById('zoomHudVal');
const trailSlider  = document.getElementById('trail');
const trailValEl   = document.getElementById('trailVal');
const modelStatus  = document.getElementById('modelStatus');
const fpsHud       = document.getElementById('fpsHud');
const canvasWrap   = document.getElementById('canvas-wrap');
const shotFlash    = document.getElementById('shotFlash');

// プレイヤーモーダル
const playerModal  = document.getElementById('playerModal');
const playerVideo  = document.getElementById('playerVideo');
const playerClose  = document.getElementById('playerClose');
const playerSpeed  = document.getElementById('playerSpeed');
const btn025x      = document.getElementById('btn025x');
const btn05x       = document.getElementById('btn05x');
const btn1x        = document.getElementById('btn1x');
const btn2x        = document.getElementById('btn2x');
const btnFramePrev = document.getElementById('btnFramePrev');
const btnFrameNext = document.getElementById('btnFrameNext');

// =====================================================
// 追跡対象定義
// =====================================================
const ALL_TARGETS = [
  { key:'person',        label:'人',           color:'#e74c3c' },
  { key:'car',           label:'車',           color:'#e67e22' },
  { key:'bicycle',       label:'自転車',       color:'#f1c40f' },
  { key:'motorcycle',    label:'バイク',       color:'#e67e22' },
  { key:'bus',           label:'バス',         color:'#e74c3c' },
  { key:'truck',         label:'トラック',     color:'#c0392b' },
  { key:'sports ball',   label:'ボール(AI)',   color:'#2ecc71' },
  { key:'golf club',     label:'ゴルフクラブ', color:'#1abc9c' },
  { key:'tennis racket', label:'ラケット',     color:'#3498db' },
  { key:'cat',           label:'猫',           color:'#9b59b6' },
  { key:'dog',           label:'犬',           color:'#8e44ad' },
  { key:'bird',          label:'鳥',           color:'#1abc9c' },
  { key:'cell phone',    label:'スマホ',       color:'#95a5a6' },
  { key:'bottle',        label:'ボトル',       color:'#27ae60' },
  { key:'COLOR_BALL',    label:'カラーボール', color:'#ffff00' },
];
const DEFAULT_ON  = new Set(['person','sports ball','COLOR_BALL']);
let activeTargets = new Set(DEFAULT_ON);

const targetGrid = document.getElementById('targetGrid');
ALL_TARGETS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'target-chip' + (activeTargets.has(t.key) ? ' on' : '');
  chip.style.setProperty('--chip-color', t.color);
  chip.dataset.key = t.key;
  chip.innerHTML = `<span class="chip-dot"></span>${t.label}`;
  chip.addEventListener('click', () => {
    if (activeTargets.has(t.key)) {
      activeTargets.delete(t.key); chip.classList.remove('on');
      Object.keys(trails).forEach(id => { if (id.startsWith(t.key+'_')) delete trails[id]; });
    } else { activeTargets.add(t.key); chip.classList.add('on'); }
  });
  targetGrid.appendChild(chip);
});

function getTargetInfo(key) { return ALL_TARGETS.find(t => t.key === key); }
trailSlider.addEventListener('input', () => { trailValEl.textContent = trailSlider.value; });

// =====================================================
// State
// =====================================================
let model         = null;
let stream        = null;
let drawAnimId    = null;
let isRunning     = false;
let zoomLevel     = 1.0;
let currentTrack  = null;
let nativeZoom    = false;
let isFrontCamera = false;
let mediaRecorder  = null;
let recordedChunks = [];
let detections = [];
let trails     = {};
let fpsFrames = 0, fpsLast = performance.now();

// =====================================================
// canvas サイズ同期（表示サイズ＝内部ピクセルに合わせる）
// =====================================================
function syncCanvasSize() {
  const rect = canvasWrap.getBoundingClientRect();
  const W = Math.round(rect.width);
  const H = Math.round(rect.height);
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W; canvas.height = H;
  }
  return { W, H };
}
new ResizeObserver(() => { if (isRunning) syncCanvasSize(); }).observe(canvasWrap);

// =====================================================
// 初期化
// =====================================================
async function init() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cams.sort((a,b) => /back|rear|environment/i.test(b.label) - /back|rear|environment/i.test(a.label));
    camSelect.innerHTML = cams.map(d =>
      `<option value="${d.deviceId}">${d.label || 'Camera '+d.deviceId.slice(0,4)}</option>`
    ).join('');
    modelStatus.textContent = 'AI MODEL: Loading...';
    model = await cocoSsd.load();
    modelStatus.textContent = 'AI MODEL: Ready ✓';
  } catch(e) { modelStatus.textContent = 'AI MODEL: Error'; }
}
init();

// =====================================================
// カメラ起動
// =====================================================
btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  trails = {}; detections = [];

  try {
    // 可能な限り高解像度でリクエスト
    let constraints = { video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 4096 },
      height: { ideal: 2160 }
    }};
    if (camSelect.value && !/Loading/.test(camSelect.value))
      constraints = { video: {
        deviceId: { exact: camSelect.value },
        width:  { ideal: 4096 },
        height: { ideal: 2160 }
      }};

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream; await vid.play();

    currentTrack = stream.getVideoTracks()[0];
    const settings = currentTrack.getSettings();
    isFrontCamera = settings.facingMode === 'user' || (currentTrack.label||'').toLowerCase().includes('front');

    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (caps.zoom) {
      nativeZoom = true;
      zoomRange.min = Math.round((caps.zoom.min||1)*100);
      zoomRange.max = Math.round((caps.zoom.max||8)*100);
      document.getElementById('zoomMode').textContent = 'ネイティブズーム対応（光学）';
      document.getElementById('zoomMode').style.color = '#27ae60';
    } else {
      nativeZoom = false; zoomRange.min=100; zoomRange.max=800;
      document.getElementById('zoomMode').textContent = 'デジタルズーム';
      document.getElementById('zoomMode').style.color = '#666';
    }
    zoomRange.value = 100; applyZoom(1.0);
    zoomPanel.classList.add('visible');

    btnStart.disabled=true; btnStop.disabled=false;
    btnShot.disabled=false; btnRec.disabled=false;

    isRunning=true; fpsLast=performance.now(); fpsFrames=0;
    syncCanvasSize();
    drawLoop();
    detectionLoop();
  } catch(e) { alert('Camera Error: '+e.message); }
};

// =====================================================
// 描画ループ
// =====================================================
function drawLoop() {
  if (!isRunning) return;
  const { W, H } = syncCanvasSize();
  if (!vid.videoWidth) { drawAnimId = requestAnimationFrame(drawLoop); return; }

  const dz = nativeZoom ? 1.0 : zoomLevel;
  const sw = vid.videoWidth/dz, sh = vid.videoHeight/dz;
  const sx = (vid.videoWidth-sw)/2, sy = (vid.videoHeight-sh)/2;

  ctx.save();
  if (isFrontCamera) { ctx.scale(-1,1); ctx.drawImage(vid,sx,sy,sw,sh,-W,0,W,H); }
  else               { ctx.drawImage(vid,sx,sy,sw,sh,0,0,W,H); }
  ctx.restore();

  // カラーボール
  if (activeTargets.has('COLOR_BALL') && ballColorSel.value !== 'none') {
    const cb = detectBallByColor(W, H);
    if (cb) {
      updateTrail('COLOR_BALL_0', cb.x, cb.y);
      const ti = getTargetInfo('COLOR_BALL');
      drawBox(cb.x-15, cb.y-15, 30, 30, ti.color, 'カラーボール', 1.0);
      drawTrailLines('COLOR_BALL_0', ti.color);
      drawCenterDot(cb.x, cb.y, ti.color);
    }
  }

  const maxLen = +trailSlider.value;
  const usedIds = new Set();

  detections.forEach((det, idx) => {
    if (!activeTargets.has(det.classKey)) return;
    const ti = getTargetInfo(det.classKey); if (!ti) return;
    const trailId = matchOrCreateTrail(det.classKey, det.cx, det.cy, idx);
    usedIds.add(trailId);
    updateTrail(trailId, det.cx, det.cy, maxLen);
    drawBox(det.bbox[0],det.bbox[1],det.bbox[2],det.bbox[3],ti.color,ti.label,det.score);
    drawTrailLines(trailId, ti.color);
    drawCenterDot(det.cx, det.cy, ti.color);
  });

  Object.keys(trails).forEach(id => {
    if (id.startsWith('COLOR_BALL')) return;
    if (!usedIds.has(id)) {
      trails[id].age = (trails[id].age||0)+1;
      if (trails[id].age > 30) delete trails[id];
    }
  });

  fpsFrames++;
  const n = performance.now();
  if (n - fpsLast > 1000) {
    fpsHud.textContent = Math.round(fpsFrames/((n-fpsLast)/1000))+' fps';
    fpsFrames=0; fpsLast=n;
  }

  drawAnimId = requestAnimationFrame(drawLoop);
}

// =====================================================
// AI 検出ループ
// =====================================================
async function detectionLoop() {
  if (!isRunning) return;
  if (!model || !vid.videoWidth) { setTimeout(detectionLoop, 100); return; }
  try {
    const ow=320, oh=240;
    const off = document.createElement('canvas'); off.width=ow; off.height=oh;
    const oc = off.getContext('2d');
    const dz = nativeZoom ? 1.0 : zoomLevel;
    const sw=vid.videoWidth/dz, sh=vid.videoHeight/dz;
    const sx=(vid.videoWidth-sw)/2, sy=(vid.videoHeight-sh)/2;
    if (isFrontCamera) { oc.save(); oc.scale(-1,1); oc.drawImage(vid,sx,sy,sw,sh,-ow,0,ow,oh); oc.restore(); }
    else { oc.drawImage(vid,sx,sy,sw,sh,0,0,ow,oh); }

    const preds = await model.detect(off);
    const W=canvas.width, H=canvas.height;
    const scaleX=W/ow, scaleY=H/oh;
    detections = preds
      .filter(p => activeTargets.has(p.class))
      .map(p => {
        const bx=p.bbox[0]*scaleX, by=p.bbox[1]*scaleY;
        const bw=p.bbox[2]*scaleX, bh=p.bbox[3]*scaleY;
        return { classKey:p.class, bbox:[bx,by,bw,bh], cx:bx+bw/2, cy:by+bh/2, score:p.score };
      });
  } catch(e) { console.warn('detection error',e); }
  if (isRunning) setTimeout(detectionLoop, 0);
}

// =====================================================
// 軌跡ユーティリティ
// =====================================================
function matchOrCreateTrail(classKey, cx, cy, idx) {
  let bestId=null, bestDist=120;
  Object.keys(trails).forEach(id => {
    if (!id.startsWith(classKey+'_')) return;
    const pts=trails[id].pts; if (!pts||pts.length===0) return;
    const last=pts[pts.length-1];
    const d=Math.hypot(cx-last.x, cy-last.y);
    if (d<bestDist){bestDist=d;bestId=id;}
  });
  if (bestId){trails[bestId].age=0;return bestId;}
  const newId=classKey+'_'+Date.now()+'_'+idx;
  trails[newId]={pts:[],age:0}; return newId;
}
function updateTrail(id, cx, cy, maxLen) {
  if (!trails[id]) trails[id]={pts:[],age:0};
  trails[id].pts.push({x:cx,y:cy});
  if (maxLen && trails[id].pts.length>maxLen) trails[id].pts.shift();
  trails[id].age=0;
}
function drawTrailLines(id, color) {
  const entry=trails[id]; if(!entry) return;
  const pts=entry.pts; if(pts.length<2) return;
  for(let i=1;i<pts.length;i++){
    const alpha=i/pts.length;
    ctx.beginPath(); ctx.moveTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=hexAlpha(color,alpha*0.9); ctx.lineWidth=1+alpha*3;
    ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  }
}
function drawCenterDot(cx,cy,color){
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,11,0,Math.PI*2);
  ctx.strokeStyle=hexAlpha(color,0.4); ctx.lineWidth=1.5; ctx.stroke();
}
function drawBox(bx,by,bw,bh,color,label,score){
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash([]); ctx.strokeRect(bx,by,bw,bh);
  const cx=bx+bw/2,cy=by+bh/2;
  ctx.strokeStyle=hexAlpha(color,0.5); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-8,cy); ctx.lineTo(cx+8,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-8); ctx.lineTo(cx,cy+8); ctx.stroke();
  ctx.font='bold 11px Courier New';
  const txt=label+(score<1?' '+Math.round(score*100)+'%':'');
  const tw=ctx.measureText(txt).width+8;
  ctx.fillStyle=color; ctx.fillRect(bx,by-16,tw,16);
  ctx.fillStyle='#000'; ctx.fillText(txt,bx+4,by-4);
}
function hexAlpha(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// =====================================================
// カラーボール検出
// =====================================================
function detectBallByColor(W, H) {
  if (!vid.videoWidth) return null;
  const ow=160,oh=120;
  const off=document.createElement('canvas'); off.width=ow; off.height=oh;
  off.getContext('2d').drawImage(vid,0,0,ow,oh);
  const data=off.getContext('2d').getImageData(0,0,ow,oh).data;
  const target=ballColorSel.value;
  let sx=0,sy=0,cnt=0;
  for(let y=0;y<oh;y+=2){for(let x=0;x<ow;x+=2){
    const i=(y*ow+x)*4; const r=data[i],g=data[i+1],b=data[i+2]; let m=false;
    if(target==='white'  &&r>210&&g>210&&b>210) m=true;
    if(target==='orange' &&r>200&&g>90&&g<170&&b<80) m=true;
    if(target==='yellow' &&r>200&&g>200&&b<100) m=true;
    if(target==='red'    &&r>160&&g<80&&b<80) m=true;
    if(m){sx+=x;sy+=y;cnt++;}
  }}
  if(cnt<5) return null;
  return{x:(sx/cnt)/ow*W, y:(sy/cnt)/oh*H};
}

// =====================================================
// ズーム
// =====================================================
function applyZoom(v){
  v=Math.max(1.0,Math.min(8.0,v)); zoomLevel=v;
  const disp=v.toFixed(1);
  document.getElementById('zoomVal').textContent=disp;
  zoomHudVal.textContent=disp; zoomRange.value=Math.round(v*100);
  zoomHud.style.display=v>1.0?'block':'none';
  if(nativeZoom&&currentTrack){try{currentTrack.applyConstraints({advanced:[{zoom:v}]});}catch(e){}}
}
zoomRange.addEventListener('input',()=>applyZoom(+zoomRange.value/100));
document.getElementById('btnZoomIn').onclick    =()=>applyZoom(zoomLevel+0.5);
document.getElementById('btnZoomOut').onclick   =()=>applyZoom(zoomLevel-0.5);
document.getElementById('btnZoomReset').onclick =()=>applyZoom(1.0);

let lastPinchDist=null;
canvasWrap.addEventListener('touchstart',e=>{if(e.touches.length===2)lastPinchDist=pDist(e.touches);},{passive:true});
canvasWrap.addEventListener('touchmove',e=>{if(e.touches.length===2&&lastPinchDist){const d=pDist(e.touches);applyZoom(zoomLevel+(d-lastPinchDist)/200);lastPinchDist=d;}},{passive:true});
canvasWrap.addEventListener('touchend',e=>{if(e.touches.length<2)lastPinchDist=null;});
function pDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}

// =====================================================
// 停止
// =====================================================
btnStop.onclick=()=>{
  isRunning=false;
  if(drawAnimId){cancelAnimationFrame(drawAnimId);drawAnimId=null;}
  if(mediaRecorder?.state==='recording')mediaRecorder.stop();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  currentTrack=null; detections=[]; trails={};
  zoomPanel.classList.remove('visible'); zoomHud.style.display='none';
  btnStart.disabled=false; btnStop.disabled=true;
  btnShot.disabled=true; btnRec.disabled=true; btnRecStop.disabled=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

// =====================================================
// ★ スクリーンショット（カメラ実解像度・正しいアスペクト比）
// =====================================================
btnShot.onclick = () => {
  // フラッシュ演出
  shotFlash.style.opacity = '0.9';
  setTimeout(() => { shotFlash.style.opacity = '0'; }, 150);

  if (!vid.videoWidth) return;

  // ★ オフスクリーンcanvasをカメラの実解像度で作成
  const vw = vid.videoWidth;
  const vh = vid.videoHeight;

  // デジタルズーム適用後のソース領域
  const dz = nativeZoom ? 1.0 : zoomLevel;
  const srcW = vw / dz, srcH = vh / dz;
  const srcX = (vw - srcW) / 2, srcY = (vh - srcH) / 2;

  // オフスクリーンcanvas = カメラ実解像度（縮小なし）
  const hiCanvas = document.createElement('canvas');
  hiCanvas.width  = Math.round(srcW);  // ズーム後の実ピクセル幅
  hiCanvas.height = Math.round(srcH);  // ズーム後の実ピクセル高さ
  const hiCtx = hiCanvas.getContext('2d');

  // ★ 映像をカメラ解像度そのままで描画（ミラー対応）
  hiCtx.save();
  if (isFrontCamera) {
    hiCtx.scale(-1, 1);
    hiCtx.drawImage(vid, srcX, srcY, srcW, srcH, -hiCanvas.width, 0, hiCanvas.width, hiCanvas.height);
  } else {
    hiCtx.drawImage(vid, srcX, srcY, srcW, srcH, 0, 0, hiCanvas.width, hiCanvas.height);
  }
  hiCtx.restore();

  // ★ 表示用canvasの追跡オーバーレイを実解像度にスケールして重ねる
  const scaleX = hiCanvas.width  / canvas.width;
  const scaleY = hiCanvas.height / canvas.height;
  hiCtx.save();
  hiCtx.scale(scaleX, scaleY);
  hiCtx.drawImage(canvas, 0, 0);
  hiCtx.restore();

  // PNG で保存（画質劣化なし）
  hiCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const ts  = new Date().toISOString().replace(/[:.]/g,'-');
    const filename = `shot_${ts}.png`;

    // 自動ダウンロード
    const a = document.createElement('a'); a.href=url; a.download=filename; a.click();

    // ギャラリーに追加
    addGalleryImage(url, filename);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }, 'image/png');
};

function addGalleryImage(url, filename) {
  document.getElementById('galleryTitle').style.display='block';
  const item = document.createElement('div'); item.className='gallery-item';
  const badge = document.createElement('div'); badge.className='type-badge badge-shot'; badge.textContent='SHOT';
  const img   = document.createElement('img'); img.src=url;
  const dl    = document.createElement('button'); dl.className='dl-btn'; dl.textContent='↓';
  dl.onclick  = () => { const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); };
  item.appendChild(badge); item.appendChild(img); item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
}

// =====================================================
// ★ 録画（canvas.captureStream → 1本の動画、ギャラリーに1件）
// =====================================================
btnRec.onclick = () => {
  recordedChunks = [];

  // canvas.captureStream() はcanvasの実ピクセルを録画する
  const stream30 = canvas.captureStream(30);
  const mimeType = ['video/mp4','video/webm;codecs=h264','video/webm;codecs=vp9','video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';

  try { mediaRecorder = new MediaRecorder(stream30, mimeType ? { mimeType } : {}); }
  catch(e) { mediaRecorder = new MediaRecorder(stream30); }

  mediaRecorder.ondataavailable = e => { if (e.data?.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const mType = mediaRecorder.mimeType || 'video/webm';
    const ext   = mType.includes('mp4') ? 'mp4' : 'webm';
    const blob  = new Blob(recordedChunks, { type: mType });
    const url   = URL.createObjectURL(blob);
    const ts    = new Date().toISOString().replace(/[:.]/g,'-');
    const filename = `rec_${ts}.${ext}`;

    // ★ ギャラリーに動画として1件だけ追加（プレイヤーで開く）
    addGalleryVideo(url, blob, filename);
  };

  mediaRecorder.start(100); // 100ms ごとにチャンクを収集
  btnRec.disabled=true; btnRecStop.disabled=false;
  btnRec.classList.add('active-rec');
  document.getElementById('recHud').style.display='block';
};

btnRecStop.onclick = () => {
  mediaRecorder.stop();
  btnRec.disabled=false; btnRecStop.disabled=true;
  btnRec.classList.remove('active-rec');
  document.getElementById('recHud').style.display='none';
};

function addGalleryVideo(url, blob, filename) {
  document.getElementById('galleryTitle').style.display='block';
  const item  = document.createElement('div'); item.className='gallery-item';
  const badge = document.createElement('div'); badge.className='type-badge badge-rec'; badge.textContent='REC';

  // サムネイル代わりに小さいvideoタグ（autoplayなし・静止）
  const thumb = document.createElement('video');
  thumb.src = url;
  thumb.muted = true;
  thumb.playsInline = true;
  // 先頭フレームをサムネイルとして表示
  thumb.currentTime = 0.1;
  thumb.style.pointerEvents = 'none';

  // ★ クリックでモーダルプレイヤーを開く（動画として再生）
  item.style.cursor = 'pointer';
  item.addEventListener('click', e => {
    if (e.target === dl) return;
    openPlayer(url);
  });

  const dl = document.createElement('button'); dl.className='dl-btn'; dl.textContent='↓';
  dl.onclick = e => {
    e.stopPropagation();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  };

  item.appendChild(badge); item.appendChild(thumb); item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
}

// =====================================================
// 動画プレイヤーモーダル（スロー・コマ送り）
// =====================================================
function openPlayer(url) {
  playerVideo.src = url;
  playerVideo.load();
  playerVideo.play();
  setPlayerSpeed(1.0);
  playerModal.classList.add('open');
}

function setPlayerSpeed(rate) {
  playerVideo.playbackRate = rate;
  playerSpeed.textContent = rate + 'x';
  [btn025x, btn05x, btn1x, btn2x].forEach(b => b.classList.remove('active'));
  if (rate === 0.25) btn025x.classList.add('active');
  else if (rate === 0.5)  btn05x.classList.add('active');
  else if (rate === 1.0)  btn1x.classList.add('active');
  else if (rate === 2.0)  btn2x.classList.add('active');
}

btn025x.onclick      = () => setPlayerSpeed(0.25);
btn05x.onclick       = () => setPlayerSpeed(0.5);
btn1x.onclick        = () => setPlayerSpeed(1.0);
btn2x.onclick        = () => setPlayerSpeed(2.0);

// コマ戻し（1フレーム ≒ 1/30秒）
btnFramePrev.onclick = () => {
  playerVideo.pause();
  playerVideo.currentTime = Math.max(0, playerVideo.currentTime - 1/30);
};
// コマ送り
btnFrameNext.onclick = () => {
  playerVideo.pause();
  playerVideo.currentTime = Math.min(playerVideo.duration||0, playerVideo.currentTime + 1/30);
};

playerClose.onclick = () => {
  playerVideo.pause(); playerVideo.src='';
  playerModal.classList.remove('open');
};
// 背景タップで閉じる
playerModal.addEventListener('click', e => {
  if (e.target === playerModal) playerClose.click();
});
</script>

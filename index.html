<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & Color Tracker Pro (Fixed)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    /* 既存のスタイルを維持[cite: 1] */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #eee; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { font-size: 16px; letter-spacing: 0.15em; color: #ff4444; margin-bottom: 14px; text-transform: uppercase; }
    .control-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 720px; }
    button { font-family: 'Courier New', monospace; font-size: 11px; padding: 7px 12px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; color: #ccc; cursor: pointer; }
    button:disabled { opacity: 0.4; }
    button.active-rec { background: #8e44ad; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    select, input[type=range] { background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 4px; font-size: 11px; }
    #canvas-wrap { position: relative; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; width: 100%; max-width: 720px; aspect-ratio: 4/3; }
    #vid, #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #vid { opacity: 0; }
    #recHud { position: absolute; top: 10px; right: 12px; color: #9b59b6; display: none; font-size: 10px; }
    #galleryGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 15px; width: 100%; max-width: 720px; }
    .gallery-item { border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; position: relative; }
    .gallery-item img, .gallery-item video { width: 100%; display: block; }
  </style>
</head>
<body>

<h1>▶ AI & Color Tracker Pro</h1>

<div class="control-row">
  <select id="camSelect"><option>Loading...</option></select>
  <button id="btnStart">START</button>
  <button id="btnStop" disabled>STOP</button>
  <label style="font-size:10px;">色
    <select id="ballColor">
      <option value="white">白</option>
      <option value="orange">オレンジ</option>
      <option value="yellow">黄色</option>
      <option value="red">赤</option>
    </select>
  </label>
</div>

<div class="control-row">
  <button id="btnShot" disabled style="color:#5dade2;">📸 SHOT</button>
  <button id="btnRec" disabled>⏺ REC</button>
  <button id="btnRecStop" disabled>⏹ STOP</button>
  <label style="font-size:10px;">軌跡<input type="range" id="trail" min="5" max="150" value="60"></label>
</div>

<div class="control-row" id="zoomRow" style="display:none;">
  <span style="font-size:11px; color:#7dcea0;">ZOOM ×<span id="zoomVal">1.0</span></span>
  <button id="btnZoomOut">－</button>
  <input type="range" id="zoomRange" min="100" max="800" value="100">
  <button id="btnZoomIn">＋</button>
  <span id="camInfo" style="font-size: 9px; margin-left: 10px; color: #888;"></span>
</div>

<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="recHud">⏺ REC</div>
</div>

<div id="galleryGrid"></div>

<script>
const vid = document.getElementById('vid');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const camSelect = document.getElementById('camSelect');
const ballColorSelect = document.getElementById('ballColor');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const btnShot = document.getElementById('btnShot');
const btnRec = document.getElementById('btnRec');
const btnRecStop = document.getElementById('btnRecStop');
const zoomRange = document.getElementById('zoomRange');

let model = null, stream = null, animId = null;
let trails = {}, zoomLevel = 1.0, currentTrack = null;
let mediaRecorder = null, recordedChunks = [];
let isFrontCamera = false;

const TARGET_MAP = {
  'person': 'Person',
  'car': 'Car',
  'bicycle': 'Bicycle',
  'golf club': 'Golf Club',
  'sports ball': 'AI Ball'
};

async function init() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    camSelect.innerHTML = devices.filter(d => d.kind === 'videoinput')
      .map(d => `<option value="${d.deviceId}">${d.label || 'Camera '+d.deviceId.slice(0,4)}</option>`).join('');
    model = await cocoSsd.load();
    document.getElementById('camInfo').textContent = "Model Loaded.";
  } catch(e) { console.error("Init error:", e); }
}
init();

btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: camSelect.value ? { exact: camSelect.value } : undefined, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    vid.srcObject = stream;
    await vid.play();
    
    currentTrack = stream.getVideoTracks()[0];
    const settings = currentTrack.getSettings();
    
    // 【修正箇所】エラー回避のための安全な判定
    const label = settings.label || ""; // labelがなければ空文字
    const facing = settings.facingMode || ""; // facingModeがなければ空文字
    
    isFrontCamera = facing === 'user' || label.toLowerCase().includes('front') || label.toLowerCase().includes('前面');
    
    document.getElementById('camInfo').textContent = isFrontCamera ? "FRONT (Mirror)" : "BACK (Normal)";
    document.getElementById('zoomRow').style.display = 'flex';
    btnStart.disabled = true; btnStop.disabled = false;
    btnShot.disabled = false; btnRec.disabled = false;
    loop();
  } catch (e) { 
    alert("Camera Access Error: " + e.message); 
    console.error(e);
  }
};

async function loop() {
  const W = canvas.width = canvas.parentElement.clientWidth;
  const H = canvas.height = canvas.parentElement.clientHeight;

  // 描画処理 (バックカメラは反転なし)[cite: 1]
  const sw = vid.videoWidth / zoomLevel, sh = vid.videoHeight / zoomLevel;
  const sx = (vid.videoWidth - sw) / 2, sy = (vid.videoHeight - sh) / 2;

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(vid, sx, sy, sw, sh, -W, 0, W, H);
  } else {
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, W, H);
  }
  ctx.restore();

  // AI & カラー追跡
  const predictions = await model.detect(canvas);
  let objects = predictions.filter(p => TARGET_MAP[p.class]);
  
  const cBall = detectBallByColor();
  if (cBall) objects.push({ class: 'sports ball', label: 'Golf Ball', bbox: [cBall.x-10, cBall.y-10, 20, 20] });

  objects.forEach((p, i) => {
    const label = TARGET_MAP[p.class] || p.label;
    const x = p.bbox[0] + p.bbox[2]/2, y = p.bbox[1] + p.bbox[3]/2;
    const id = label + (label === 'Golf Ball' ? '' : i);

    if (!trails[id]) trails[id] = [];
    trails[id].push({x, y});
    if (trails[id].length > document.getElementById('trail').value) trails[id].shift();

    ctx.strokeStyle = (label === 'Golf Ball') ? '#ffff00' : '#ff4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    trails[id].forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(label, x + 5, y - 5);
  });

  animId = requestAnimationFrame(loop);
}

function detectBallByColor() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const target = ballColorSelect.value;
  let sx = 0, sy = 0, cnt = 0;
  for (let y = 0; y < canvas.height; y += 10) {
    for (let x = 0; x < canvas.width; x += 10) {
      const i = (y * canvas.width + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      let m = false;
      if (target === 'white' && r > 210 && g > 210 && b > 210) m = true;
      if (target === 'orange' && r > 200 && g > 100 && b < 100) m = true;
      if (target === 'yellow' && r > 200 && g > 200 && b < 100) m = true;
      if (target === 'red' && r > 160 && g < 80 && b < 80) m = true;
      if (m) { sx += x; sy += y; cnt++; }
    }
  }
  return cnt > 3 ? { x: sx/cnt, y: sy/cnt } : null;
}

// ズーム[cite: 1]
function updateZoom(v) {
  zoomLevel = v;
  document.getElementById('zoomVal').textContent = v.toFixed(1);
  if (currentTrack?.getCapabilities()?.zoom) {
    currentTrack.applyConstraints({ advanced: [{ zoom: v }] });
  }
}
zoomRange.oninput = () => updateZoom(zoomRange.value / 100);
document.getElementById('btnZoomIn').onclick = () => updateZoom(Math.min(8, zoomLevel + 0.5));
document.getElementById('btnZoomOut').onclick = () => updateZoom(Math.max(1, zoomLevel - 0.5));

// 撮影・録画[cite: 1]
btnShot.onclick = () => {
  const a = document.createElement('a'); a.href = canvas.toDataURL();
  a.download = `shot_${Date.now()}.png`; a.click();
};
btnRec.onclick = () => {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(canvas.captureStream(30), { mimeType: 'video/webm' });
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
    const item = document.createElement('div'); item.className = 'gallery-item';
    const v = document.createElement('video'); v.src = url; v.controls = true;
    item.appendChild(v); document.getElementById('galleryGrid').prepend(item);
  };
  mediaRecorder.start();
  btnRec.disabled = true; btnRecStop.disabled = false;
  btnRecStop.classList.add('active-rec');
  document.getElementById('recHud').style.display = 'block';
};
btnRecStop.onclick = () => {
  mediaRecorder.stop();
  btnRec.disabled = false; btnRecStop.disabled = true;
  btnRecStop.classList.remove('active-rec');
  document.getElementById('recHud').style.display = 'none';
};
btnStop.onclick = () => {
  cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  btnStart.disabled = false; btnStop.disabled = true;
};
</script>
</body>
</html>

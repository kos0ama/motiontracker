<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Cameraman</title>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <!-- COCO-SSD (人検出) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
  <!-- MediaPipe Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    /* ===== BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080808; color: #ddd; font-family: 'Courier New', monospace; overflow-x: hidden; }

    /* ===== APP LAYOUT ===== */
    #app { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ----- VIDEO TOP ----- */
    #video-area { position: relative; width: 100%; background: #000; flex-shrink: 0; }
    #canvas-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; }
    #vid    { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; pointer-events:none; }
    #canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

    /* ===== LANDSCAPE ===== */
    @media (orientation: landscape) {
      #app { flex-direction: row; height: 100dvh; overflow: hidden; }
      #video-area { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; }
      #canvas-wrap { width:auto; height:100dvh; aspect-ratio:16/9; }
      #ctrl-area { width:230px; flex:none; height:100dvh; overflow-y:auto; border-left:1px solid #1a1a1a; }
    }

    /* ----- CONTROLS BOTTOM ----- */
    #ctrl-area { flex:1; overflow-y:auto; padding:10px 12px 24px; display:flex; flex-direction:column; gap:8px; }

    .section { background:#111; border:1px solid #1e1e1e; border-radius:8px; padding:8px 10px; }
    .section-title { font-size:9px; color:#444; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px; }

    /* ===== BUTTONS ===== */
    button {
      font-family:'Courier New',monospace; font-size:11px; padding:6px 10px;
      border:1px solid #333; border-radius:6px; background:#181818; color:#aaa;
      cursor:pointer; transition:all 0.12s; white-space:nowrap;
    }
    button:hover:not(:disabled) { background:#222; color:#fff; }
    button:disabled { opacity:0.3; cursor:default; }
    .btn-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

    .btn-start  { border-color:#1e8449; color:#58d68d; }
    .btn-stop   { border-color:#922b21; color:#e74c3c; }
    .btn-shot   { border-color:#1a5276; color:#5dade2; }
    .btn-rec    { border-color:#6c3483; color:#bb8fce; }
    .btn-rec.recording { background:#6c3483; color:#fff; animation:pulse 1.2s infinite; }

    /* AI Cameraman toggle */
    .btn-ai { border-color:#7d6608; color:#f4d03f; }
    .btn-ai.on { background:#3d3000; color:#f9e300; border-color:#f4d03f; }

    /* mode chips */
    .mode-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 10px; border:1px solid #2a2a2a; border-radius:20px;
      font-size:10px; color:#666; cursor:pointer; background:#131313;
      transition:all 0.12s; user-select:none;
    }
    .mode-chip.on { border-color:var(--cc,#f4d03f); color:var(--cc,#f4d03f); background:color-mix(in srgb,var(--cc,#f4d03f) 12%,#131313); }
    .mode-dot { width:6px; height:6px; border-radius:50%; background:var(--cc,#888); opacity:0.4; flex-shrink:0; }
    .mode-chip.on .mode-dot { opacity:1; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

    select { background:#181818; color:#ccc; border:1px solid #333; border-radius:4px; font-size:11px; padding:4px 6px; font-family:'Courier New',monospace; }
    input[type=range] { accent-color:#f4d03f; width:100%; }
    label.lbl { font-size:10px; color:#555; display:block; margin-top:6px; }

    /* ===== HUD overlays ===== */
    .hud { position:absolute; font-size:10px; letter-spacing:0.07em; pointer-events:none; }
    #fpsHud     { top:8px; left:10px; color:#444; }
    #recHud     { top:8px; right:10px; color:#9b59b6; display:none; }
    #aiHud      { top:8px; left:50%; transform:translateX(-50%); color:#f4d03f; display:none; background:rgba(0,0,0,0.5); padding:2px 10px; border-radius:20px; }
    #shotFlash  { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity 0.05s; border-radius:4px; }
    #modelStatus{ bottom:8px; left:10px; color:#333; }
    #chanceHud  { bottom:30px; left:50%; transform:translateX(-50%); display:none; white-space:nowrap;
                  background:rgba(244,208,63,0.9); color:#000; font-weight:bold; padding:4px 14px; border-radius:20px; font-size:12px; }

    /* frame guide overlay (autoframing) */
    #frameGuide { position:absolute; inset:0; pointer-events:none; }

    /* ===== gallery ===== */
    #galleryGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:5px; }
    .gallery-item { border:1px solid #1e1e1e; border-radius:5px; overflow:hidden; position:relative; }
    .gallery-item img, .gallery-item video { width:100%; display:block; }
    .dl-btn { position:absolute; bottom:3px; right:3px; font-size:9px; padding:2px 5px; border-radius:3px; background:rgba(0,0,0,0.8); border:1px solid #444; color:#ccc; cursor:pointer; }
    .gallery-item .badge { position:absolute; top:3px; left:3px; font-size:8px; padding:1px 5px; border-radius:10px; }
    .badge-auto { background:rgba(244,208,63,0.85); color:#000; }
    .badge-shot { background:rgba(93,173,226,0.85); color:#000; }
    .badge-rec  { background:rgba(142,68,173,0.85); color:#fff; }
  </style>
</head>
<body>
<div id="app">

  <!-- ====== VIDEO ====== -->
  <div id="video-area">
    <div id="canvas-wrap">
      <video id="vid" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <svg id="frameGuide" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hud" id="fpsHud">-- fps</div>
      <div class="hud" id="recHud">⏺ REC</div>
      <div class="hud" id="aiHud">🎬 AI CAMERAMAN</div>
      <div class="hud" id="chanceHud">📸 シャッターチャンス！</div>
      <div class="hud" id="modelStatus">Loading models...</div>
      <div id="shotFlash"></div>
    </div>
  </div>

  <!-- ====== CONTROLS ====== -->
  <div id="ctrl-area">

    <!-- Camera -->
    <div class="section">
      <div class="section-title">Camera</div>
      <select id="camSelect" style="width:100%;margin-bottom:6px;"><option>Loading...</option></select>
      <div class="btn-row">
        <button id="btnStart" class="btn-start">▶ START</button>
        <button id="btnStop"  class="btn-stop" disabled>■ STOP</button>
      </div>
    </div>

    <!-- AI Cameraman Master Switch -->
    <div class="section">
      <div class="section-title">AI Cameraman</div>
      <div class="btn-row" style="margin-bottom:8px;">
        <button id="btnAI" class="btn-ai" disabled>🎬 AI カメラマン OFF</button>
      </div>
      <!-- Sub-modes -->
      <div style="display:flex;flex-wrap:wrap;gap:5px;">
        <div class="mode-chip on" data-mode="autoframe" style="--cc:#f4d03f;">
          <span class="mode-dot"></span>オートフレーム
        </div>
        <div class="mode-chip on" data-mode="pose" style="--cc:#58d68d;">
          <span class="mode-dot"></span>ポーズ検知
        </div>
        <div class="mode-chip on" data-mode="smile" style="--cc:#bb8fce;">
          <span class="mode-dot"></span>笑顔検知
        </div>
        <div class="mode-chip on" data-mode="still" style="--cc:#5dade2;">
          <span class="mode-dot"></span>静止検知
        </div>
      </div>
      <label class="lbl" style="margin-top:8px;">
        フレーミング余白：<span id="paddingVal">30</span>%
        <input type="range" id="paddingSlider" min="10" max="60" value="30">
      </label>
      <label class="lbl">
        平滑化強度：<span id="smoothVal">0.08</span>
        <input type="range" id="smoothSlider" min="2" max="20" value="8">
      </label>
      <label class="lbl">
        シャッター感度：<span id="sensVal">0.85</span>
        <input type="range" id="sensSlider" min="60" max="98" value="85">
      </label>
    </div>

    <!-- Record / Shot -->
    <div class="section">
      <div class="section-title">Record / Shot</div>
      <div class="btn-row">
        <button id="btnShot"    class="btn-shot" disabled>📷 SHOT</button>
        <button id="btnRec"     class="btn-rec"  disabled>⏺ REC</button>
        <button id="btnRecStop" class="btn-rec"  disabled>⏹ STOP</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="section">
      <div class="section-title">Settings</div>
      <label class="lbl">軌跡の長さ：<span id="trailVal">40</span>
        <input type="range" id="trail" min="5" max="120" value="40">
      </label>
      <label class="lbl" style="margin-top:6px;">バッファ（秒前）：<span id="bufVal">0.5</span>s
        <input type="range" id="bufSlider" min="0" max="20" value="5">
      </label>
    </div>

    <!-- Gallery -->
    <div class="section">
      <div class="section-title">Gallery</div>
      <div id="galleryGrid"></div>
    </div>

  </div><!-- /ctrl-area -->
</div><!-- /app -->

<script>
'use strict';
// ═══════════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════════
const vid         = document.getElementById('vid');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const camSelect   = document.getElementById('camSelect');
const btnStart    = document.getElementById('btnStart');
const btnStop     = document.getElementById('btnStop');
const btnShot     = document.getElementById('btnShot');
const btnRec      = document.getElementById('btnRec');
const btnRecStop  = document.getElementById('btnRecStop');
const btnAI       = document.getElementById('btnAI');
const modelStatus = document.getElementById('modelStatus');
const fpsHud      = document.getElementById('fpsHud');
const recHud      = document.getElementById('recHud');
const aiHud       = document.getElementById('aiHud');
const chanceHud   = document.getElementById('chanceHud');
const shotFlash   = document.getElementById('shotFlash');
const frameGuide  = document.getElementById('frameGuide');
const trailSlider = document.getElementById('trail');
const trailValEl  = document.getElementById('trailVal');
const canvasWrap  = document.getElementById('canvas-wrap');
const paddingSlider = document.getElementById('paddingSlider');
const smoothSlider  = document.getElementById('smoothSlider');
const sensSlider    = document.getElementById('sensSlider');
const bufSlider     = document.getElementById('bufSlider');

// ═══════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════
let cocoModel    = null;
let poseDetector = null;
let faceMesh     = null;
let stream       = null;
let isRunning    = false;
let drawAnimId   = null;
let isFrontCam   = false;

let mediaRecorder  = null;
let recordedChunks = [];

// AI Cameraman
let aiMode     = false;
let subModes   = { autoframe:true, pose:true, smile:true, still:true };

// 検出結果（描画ループが参照）
let cocoDetections  = [];  // COCO-SSD
let poseResults     = null;
let faceResults     = null;

// オートフレーミング smooth state
const viewport = { sx:0, sy:0, sw:1, sh:1 }; // 正規化（0〜1）
const smoothVp = { sx:0, sy:0, sw:1, sh:1 };  // スムージング済み

// 軌跡
let trails = {};

// フレームバッファ（シャッターチャンス用）
const FRAME_BUFFER = [];   // { dataUrl, ts }
let bufSeconds = 0.5;

// シャッターチャンス制御
let lastShotTs    = 0;
const SHOT_COOLDOWN = 3000; // ms
let chanceTimer   = null;

// ポーズ静止検知
const wristHistory = [];   // 直近 N フレームの [lx,ly,rx,ry]
const WRIST_HIST_LEN = 20;
let wasMoving = false;

// FPS
let fpsFrames = 0, fpsLast = performance.now();

// ═══════════════════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════════════════
trailSlider.addEventListener('input', () => { trailValEl.textContent = trailSlider.value; });
paddingSlider.addEventListener('input', () => { document.getElementById('paddingVal').textContent = paddingSlider.value; });
smoothSlider.addEventListener('input',  () => { document.getElementById('smoothVal').textContent  = (+smoothSlider.value/100).toFixed(2); });
sensSlider.addEventListener('input',    () => { document.getElementById('sensVal').textContent    = (+sensSlider.value/100).toFixed(2); });
bufSlider.addEventListener('input',     () => {
  bufSeconds = +bufSlider.value / 10;
  document.getElementById('bufVal').textContent = bufSeconds.toFixed(1);
});

// Sub-mode chips
document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const m = chip.dataset.mode;
    subModes[m] = !subModes[m];
    chip.classList.toggle('on', subModes[m]);
  });
});

// ═══════════════════════════════════════════════════
// canvas size sync
// ═══════════════════════════════════════════════════
function syncCanvasSize() {
  const r = canvasWrap.getBoundingClientRect();
  const W = Math.round(r.width), H = Math.round(r.height);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  return { W, H };
}
new ResizeObserver(() => { if (isRunning) syncCanvasSize(); }).observe(canvasWrap);

// ═══════════════════════════════════════════════════
// Init: load models
// ═══════════════════════════════════════════════════
async function init() {
  modelStatus.textContent = 'COCO-SSD loading...';
  try {
    // カメラ一覧
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cams.sort((a,b) => /back|rear|environment/i.test(b.label) - /back|rear|environment/i.test(a.label));
    camSelect.innerHTML = cams.map(d =>
      `<option value="${d.deviceId}">${d.label || 'Camera '+d.deviceId.slice(0,4)}</option>`
    ).join('');

    cocoModel = await cocoSsd.load();
    modelStatus.textContent = 'COCO-SSD ✓  MediaPipe loading...';

    // MediaPipe Pose
    poseDetector = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}` });
    poseDetector.setOptions({ modelComplexity:1, smoothLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    poseDetector.onResults(r => { poseResults = r; });

    // MediaPipe FaceMesh
    faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}` });
    faceMesh.setOptions({ maxNumFaces:3, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    faceMesh.onResults(r => { faceResults = r; });

    modelStatus.textContent = 'All models ready ✓';
  } catch(e) {
    modelStatus.textContent = 'Model error: ' + e.message;
    console.error(e);
  }
}
init();

// ═══════════════════════════════════════════════════
// Camera start
// ═══════════════════════════════════════════════════
btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  trails = {}; cocoDetections = []; poseResults = null; faceResults = null;
  FRAME_BUFFER.length = 0; wristHistory.length = 0;
  Object.assign(smoothVp, { sx:0, sy:0, sw:1, sh:1 });
  Object.assign(viewport, { sx:0, sy:0, sw:1, sh:1 });

  try {
    let constraints = { video: { facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} } };
    if (camSelect.value && !/Loading/.test(camSelect.value))
      constraints = { video: { deviceId:{exact:camSelect.value}, width:{ideal:1280}, height:{ideal:720} } };

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream; await vid.play();

    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings();
    isFrontCam = settings.facingMode === 'user' || (track.label||'').toLowerCase().includes('front');

    btnStart.disabled = true; btnStop.disabled = false;
    btnShot.disabled = false; btnRec.disabled = false; btnAI.disabled = false;

    isRunning = true;
    fpsLast = performance.now(); fpsFrames = 0;
    syncCanvasSize();
    drawLoop();
    cocoLoop();
    mediapipeLoop();
  } catch(e) { alert('Camera Error: ' + e.message); }
};

// ═══════════════════════════════════════════════════
// AI Cameraman toggle
// ═══════════════════════════════════════════════════
btnAI.onclick = () => {
  aiMode = !aiMode;
  btnAI.textContent = aiMode ? '🎬 AI カメラマン ON' : '🎬 AI カメラマン OFF';
  btnAI.classList.toggle('on', aiMode);
  aiHud.style.display = aiMode ? 'block' : 'none';
  if (!aiMode) {
    // リセット
    Object.assign(smoothVp, { sx:0, sy:0, sw:1, sh:1 });
    updateFrameGuide(null);
  }
};

// ═══════════════════════════════════════════════════
// MAIN DRAW LOOP
// ═══════════════════════════════════════════════════
function drawLoop() {
  if (!isRunning) return;
  const { W, H } = syncCanvasSize();
  if (!vid.videoWidth) { drawAnimId = requestAnimationFrame(drawLoop); return; }

  const vw = vid.videoWidth, vh = vid.videoHeight;

  // ---- オートフレーミング計算 ----
  if (aiMode && subModes.autoframe) {
    computeAutoframing(vw, vh);
  } else {
    Object.assign(smoothVp, { sx:0, sy:0, sw:1, sh:1 });
  }

  // 正規化viewport → ピクセル
  const srcX = smoothVp.sx * vw;
  const srcY = smoothVp.sy * vh;
  const srcW = smoothVp.sw * vw;
  const srcH = smoothVp.sh * vh;

  // 映像描画（ミラー対応）
  ctx.save();
  if (isFrontCam) {
    ctx.scale(-1,1);
    ctx.drawImage(vid, srcX, srcY, srcW, srcH, -W, 0, W, H);
  } else {
    ctx.drawImage(vid, srcX, srcY, srcW, srcH, 0, 0, W, H);
  }
  ctx.restore();

  // ---- フレームバッファに保存 ----
  if (aiMode) {
    const now = performance.now();
    FRAME_BUFFER.push({ ts: now, dataUrl: canvas.toDataURL('image/jpeg', 0.7) });
    // バッファサイズを制限（最大 4秒分 @ 30fps = 120枚）
    while (FRAME_BUFFER.length > 0 && now - FRAME_BUFFER[0].ts > 4000) FRAME_BUFFER.shift();
  }

  // ---- COCO-SSD 検出結果を描画（AIモード時は追従枠のみ） ----
  if (!aiMode) {
    cocoDetections.forEach(det => {
      if (det.classKey !== 'person') return;
      const { sx:px, sy:py, sw:pw, sh:ph } = detToCanvas(det.bbox, vw, vh, W, H);
      ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.strokeRect(px, py, pw, ph);
    });
  }

  // ---- Pose landmarks 描画 ----
  if (poseResults?.poseLandmarks && aiMode) {
    drawPoseSkeleton(poseResults.poseLandmarks, W, H, srcX, srcY, srcW, srcH, vw, vh);
  }

  // ---- Face Mesh 描画（目・口の輪郭） ----
  if (faceResults?.multiFaceLandmarks?.length && aiMode) {
    drawFaceContour(faceResults.multiFaceLandmarks[0], W, H, srcX, srcY, srcW, srcH, vw, vh);
  }

  // ---- シャッターチャンス判定 ----
  if (aiMode) evaluateShutterChance();

  // ---- FPS ----
  fpsFrames++;
  const n = performance.now();
  if (n - fpsLast > 1000) {
    fpsHud.textContent = Math.round(fpsFrames / ((n - fpsLast) / 1000)) + ' fps';
    fpsFrames = 0; fpsLast = n;
  }

  drawAnimId = requestAnimationFrame(drawLoop);
}

// ═══════════════════════════════════════════════════
// COCO-SSD detection loop (独立・非同期)
// ═══════════════════════════════════════════════════
async function cocoLoop() {
  if (!isRunning) return;
  if (!cocoModel || !vid.videoWidth) { setTimeout(cocoLoop, 100); return; }
  try {
    const preds = await cocoModel.detect(vid);
    cocoDetections = preds.map(p => ({
      classKey: p.class,
      bbox: p.bbox,  // [x,y,w,h] in video pixels
      score: p.score
    }));
  } catch(e) {}
  if (isRunning) setTimeout(cocoLoop, 0);
}

// ═══════════════════════════════════════════════════
// MediaPipe loop (Pose + FaceMesh, 間引き)
// ═══════════════════════════════════════════════════
let mpFrame = 0;
async function mediapipeLoop() {
  if (!isRunning) return;
  if (!vid.videoWidth || !poseDetector) { setTimeout(mediapipeLoop, 100); return; }
  try {
    mpFrame++;
    // Pose: 毎フレーム
    await poseDetector.send({ image: vid });
    // FaceMesh: 2フレームに1回（重いため間引き）
    if (mpFrame % 2 === 0 && faceMesh) await faceMesh.send({ image: vid });
  } catch(e) {}
  if (isRunning) setTimeout(mediapipeLoop, 0);
}

// ═══════════════════════════════════════════════════
// AUTO FRAMING
// ═══════════════════════════════════════════════════
function computeAutoframing(vw, vh) {
  // 1. メイン被写体の選定（最大面積の person）
  const persons = cocoDetections.filter(d => d.classKey === 'person');
  if (persons.length === 0) {
    // 被写体なし → ゆっくり全体に戻す
    lerpVp(viewport, { sx:0, sy:0, sw:1, sh:1 }, 0.02);
    lerpVp(smoothVp, viewport, getSmoothAlpha());
    updateFrameGuide(null);
    return;
  }

  // 中央に近い人 or 最大面積の人
  const cx = vw / 2, cy = vh / 2;
  const main = persons.reduce((best, p) => {
    const pcx = p.bbox[0] + p.bbox[2]/2;
    const pcy = p.bbox[1] + p.bbox[3]/2;
    const dist = Math.hypot(pcx - cx, pcy - cy);
    const area = p.bbox[2] * p.bbox[3];
    const score = area - dist * 0.5; // 面積優先、距離ペナルティ
    return score > best.score ? { p, score } : best;
  }, { p: persons[0], score: -Infinity }).p;

  // 2. 理想の表示エリアを計算（余白付き）
  const pad = +paddingSlider.value / 100;
  const [bx, by, bw, bh] = main.bbox;
  const centerX = (bx + bw/2) / vw;
  const centerY = (by + bh/2) / vh;
  const normW = (bw / vw) * (1 + pad * 2);
  const normH = (bh / vh) * (1 + pad * 2);

  // アスペクト比を保持（16:9）
  const aspect = 16/9;
  let fw = Math.max(normW, normH * aspect);
  let fh = fw / aspect;
  fw = Math.min(fw, 1); fh = Math.min(fh, 1);
  const fx = Math.max(0, Math.min(1 - fw, centerX - fw/2));
  const fy = Math.max(0, Math.min(1 - fh, centerY - fh/2));

  // 3. 目標ビューポートを更新
  lerpVp(viewport, { sx:fx, sy:fy, sw:fw, sh:fh }, 0.15);

  // 4. スムージング（ローパスフィルター）
  lerpVp(smoothVp, viewport, getSmoothAlpha());

  // 5. フレームガイド描画
  updateFrameGuide({ fx, fy, fw, fh });
}

function lerpVp(target, goal, alpha) {
  target.sx += (goal.sx - target.sx) * alpha;
  target.sy += (goal.sy - target.sy) * alpha;
  target.sw += (goal.sw - target.sw) * alpha;
  target.sh += (goal.sh - target.sh) * alpha;
}

function getSmoothAlpha() {
  return +smoothSlider.value / 100; // 0.02〜0.20
}

// フレームガイド（SVGオーバーレイ）
function updateFrameGuide(rect) {
  if (!rect || !aiMode || !subModes.autoframe) { frameGuide.innerHTML=''; return; }
  const W = canvas.width, H = canvas.height;
  // 現在の smoothVp で目標位置を逆算してキャンバス座標に
  const gx = ((rect.fx - smoothVp.sx) / smoothVp.sw) * W;
  const gy = ((rect.fy - smoothVp.sy) / smoothVp.sh) * H;
  const gw = (rect.fw / smoothVp.sw) * W;
  const gh = (rect.fh / smoothVp.sh) * H;
  const cs = 14;
  frameGuide.innerHTML = `
    <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}"
      fill="none" stroke="rgba(244,208,63,0.35)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="${gx}" y1="${gy}" x2="${gx+cs}" y2="${gy}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+cs}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy}" x2="${gx+gw-cs}" y2="${gy}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy}" x2="${gx+gw}" y2="${gy+cs}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy+gh}" x2="${gx+cs}" y2="${gy+gh}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx}" y1="${gy+gh}" x2="${gx}" y2="${gy+gh-cs}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy+gh}" x2="${gx+gw-cs}" y2="${gy+gh}" stroke="#f4d03f" stroke-width="2"/>
    <line x1="${gx+gw}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh-cs}" stroke="#f4d03f" stroke-width="2"/>
  `;
}

// ═══════════════════════════════════════════════════
// POSE SKELETON 描画
// ═══════════════════════════════════════════════════
const POSE_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]
];
function drawPoseSkeleton(landmarks, W, H, srcX, srcY, srcW, srcH, vw, vh) {
  const toCanvas = (lm) => {
    const px = lm.x * vw;
    const py = lm.y * vh;
    return {
      x: ((px - srcX) / srcW) * W,
      y: ((py - srcY) / srcH) * H,
      vis: lm.visibility
    };
  };
  ctx.strokeStyle = 'rgba(88,214,141,0.7)';
  ctx.lineWidth = 1.5;
  POSE_CONNECTIONS.forEach(([a,b]) => {
    const pa = toCanvas(landmarks[a]);
    const pb = toCanvas(landmarks[b]);
    if (pa.vis < 0.3 || pb.vis < 0.3) return;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });
  // 関節点
  [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i => {
    const p = toCanvas(landmarks[i]);
    if (p.vis < 0.3) return;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fillStyle = '#58d68d'; ctx.fill();
  });
}

// ═══════════════════════════════════════════════════
// FACE CONTOUR 描画（目・口の輪郭）
// ═══════════════════════════════════════════════════
const LEFT_EYE  = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const RIGHT_EYE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
const LIPS_OUTER= [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];

function drawFaceContour(landmarks, W, H, srcX, srcY, srcW, srcH, vw, vh) {
  const toC = lm => ({
    x: ((lm.x * vw - srcX) / srcW) * W,
    y: ((lm.y * vh - srcY) / srcH) * H
  });
  [LEFT_EYE, RIGHT_EYE].forEach(idxs => {
    ctx.beginPath();
    idxs.forEach((i,n) => { const p=toC(landmarks[i]); n===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.closePath(); ctx.strokeStyle='rgba(187,143,206,0.7)'; ctx.lineWidth=1; ctx.stroke();
  });
  ctx.beginPath();
  LIPS_OUTER.forEach((i,n) => { const p=toC(landmarks[i]); n===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  ctx.closePath(); ctx.strokeStyle='rgba(187,143,206,0.5)'; ctx.lineWidth=1; ctx.stroke();
}

// ═══════════════════════════════════════════════════
// SHUTTER CHANCE DETECTION
// ═══════════════════════════════════════════════════
function evaluateShutterChance() {
  const now = performance.now();
  if (now - lastShotTs < SHOT_COOLDOWN) return;

  const threshold = +sensSlider.value / 100; // 0.6〜0.98

  // A. 笑顔検知（FaceMesh の口の開き具合）
  if (subModes.smile && faceResults?.multiFaceLandmarks?.length) {
    const lms = faceResults.multiFaceLandmarks[0];
    const smileScore = estimateSmileScore(lms);
    if (smileScore > threshold) {
      triggerShot('😊 笑顔検知！'); return;
    }
  }

  // B. ポーズ静止検知（激しい動きの後のピタッ）
  if (subModes.still && poseResults?.poseLandmarks) {
    const lms = poseResults.poseLandmarks;
    const lw = lms[15], rw = lms[16]; // 左右手首
    if (lw && rw && lw.visibility > 0.5 && rw.visibility > 0.5) {
      wristHistory.push([lw.x, lw.y, rw.x, rw.y]);
      if (wristHistory.length > WRIST_HIST_LEN) wristHistory.shift();

      if (wristHistory.length === WRIST_HIST_LEN) {
        const recent  = motionAmount(wristHistory.slice(-5));
        const earlier = motionAmount(wristHistory.slice(0, 10));
        if (earlier > 0.015 && recent < 0.004) {
          if (!wasMoving) { wasMoving = true; }
          else {
            triggerShot('🏌 静止検知！'); wasMoving = false; return;
          }
        } else if (earlier < 0.005) {
          wasMoving = false;
        }
      }
    }
  }

  // C. 万歳・ポーズ検知（両手が頭より上）
  if (subModes.pose && poseResults?.poseLandmarks) {
    const lms = poseResults.poseLandmarks;
    const lw = lms[15], rw = lms[16];
    const nose = lms[0];
    if (lw && rw && nose && lw.visibility > 0.6 && rw.visibility > 0.6) {
      if (lw.y < nose.y - 0.05 && rw.y < nose.y - 0.05) {
        triggerShot('🙌 ポーズ検知！'); return;
      }
    }
  }
}

// 笑顔スコア（口の縦開き / 口幅で正規化）
function estimateSmileScore(lms) {
  const topLip = lms[13];    // 上唇中央
  const botLip = lms[14];    // 下唇中央
  const leftMouth = lms[61];
  const rightMouth = lms[291];
  const mouthOpen = Math.abs(topLip.y - botLip.y);
  const mouthWidth = Math.abs(leftMouth.x - rightMouth.x);
  // 口の高さ/幅比率（笑顔だと下がる → 逆数で評価）
  const ratio = mouthOpen / (mouthWidth + 1e-6);
  // 口角の上がり具合（左右の口角のy座標が口中央より低い）
  const midY = (topLip.y + botLip.y) / 2;
  const cornerLift = Math.max(0, midY - (leftMouth.y + rightMouth.y) / 2);
  const score = Math.min(1, cornerLift * 15 + (1 - ratio * 3) * 0.5);
  return score;
}

// 動き量（連続フレーム間の平均変位）
function motionAmount(history) {
  let total = 0;
  for (let i = 1; i < history.length; i++) {
    const p = history[i-1], c = history[i];
    total += Math.hypot(c[0]-p[0],c[1]-p[1]) + Math.hypot(c[2]-p[2],c[3]-p[3]);
  }
  return total / Math.max(1, history.length - 1);
}

// ═══════════════════════════════════════════════════
// TRIGGER SHOT（バッファから0.5秒前を取得）
// ═══════════════════════════════════════════════════
function triggerShot(reason) {
  const now = performance.now();
  lastShotTs = now;

  // バッファから目標時刻のフレームを探す
  const targetTs = now - bufSeconds * 1000;
  let best = FRAME_BUFFER[FRAME_BUFFER.length - 1]; // フォールバック：最新
  for (const f of FRAME_BUFFER) {
    if (f.ts >= targetTs) { best = f; break; }
  }

  if (!best) return;

  // フラッシュ演出
  shotFlash.style.opacity = '0.9';
  setTimeout(() => { shotFlash.style.opacity = '0'; }, 150);

  // HUD 表示
  chanceHud.textContent = '📸 ' + reason;
  chanceHud.style.display = 'block';
  clearTimeout(chanceTimer);
  chanceTimer = setTimeout(() => { chanceHud.style.display = 'none'; }, 2000);

  // ギャラリーに追加（自動撮影バッジ）
  addGallery('image', best.dataUrl, null, 'auto_'+Date.now()+'.jpg', 'auto');
}

// ═══════════════════════════════════════════════════
// COORDINATE UTILS
// ═══════════════════════════════════════════════════
function detToCanvas(bbox, vw, vh, W, H) {
  // bbox: [x,y,w,h] in video pixels → canvas pixels (via smoothVp)
  const srcX = smoothVp.sx * vw, srcY = smoothVp.sy * vh;
  const srcW = smoothVp.sw * vw, srcH = smoothVp.sh * vh;
  return {
    sx: ((bbox[0] - srcX) / srcW) * W,
    sy: ((bbox[1] - srcY) / srcH) * H,
    sw: (bbox[2] / srcW) * W,
    sh: (bbox[3] / srcH) * H
  };
}

// ═══════════════════════════════════════════════════
// STOP
// ═══════════════════════════════════════════════════
btnStop.onclick = () => {
  isRunning = false;
  if (drawAnimId) { cancelAnimationFrame(drawAnimId); drawAnimId = null; }
  if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cocoDetections = []; poseResults = null; faceResults = null;
  FRAME_BUFFER.length = 0;
  aiMode = false; btnAI.classList.remove('on');
  btnAI.textContent = '🎬 AI カメラマン OFF';
  aiHud.style.display = 'none'; chanceHud.style.display = 'none';
  frameGuide.innerHTML = '';
  btnStart.disabled=false; btnStop.disabled=true;
  btnShot.disabled=true; btnRec.disabled=true; btnRecStop.disabled=true; btnAI.disabled=true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

// ═══════════════════════════════════════════════════
// MANUAL SHOT / REC
// ═══════════════════════════════════════════════════
btnShot.onclick = () => {
  shotFlash.style.opacity = '0.9';
  setTimeout(() => { shotFlash.style.opacity = '0'; }, 150);
  const dataUrl = canvas.toDataURL('image/png');
  addGallery('image', dataUrl, null, 'shot_'+Date.now()+'.png', 'shot');
  const a = document.createElement('a'); a.href=dataUrl; a.download='shot_'+Date.now()+'.png'; a.click();
};

btnRec.onclick = () => {
  recordedChunks = [];
  const mime = ['video/mp4','video/webm;codecs=h264','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  try { mediaRecorder = new MediaRecorder(canvas.captureStream(30), mime?{mimeType:mime}:{}); }
  catch(e){ mediaRecorder = new MediaRecorder(canvas.captureStream(30)); }
  mediaRecorder.ondataavailable = e => { if(e.data?.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks,{type:mediaRecorder.mimeType||'video/webm'});
    const url = URL.createObjectURL(blob);
    const ext = (mediaRecorder.mimeType||'').includes('mp4')?'mp4':'webm';
    addGallery('video', url, blob, 'rec_'+Date.now()+'.'+ext, 'rec');
  };
  mediaRecorder.start(100);
  btnRec.disabled=true; btnRecStop.disabled=false;
  btnRec.classList.add('recording');
  recHud.style.display = 'block';
};

btnRecStop.onclick = () => {
  mediaRecorder.stop();
  btnRec.disabled=false; btnRecStop.disabled=true;
  btnRec.classList.remove('recording');
  recHud.style.display = 'none';
};

// ═══════════════════════════════════════════════════
// GALLERY
// ═══════════════════════════════════════════════════
function addGallery(type, url, blob, filename, badge) {
  const item = document.createElement('div'); item.className='gallery-item';
  if (type==='image') {
    const img=document.createElement('img'); img.src=url; item.appendChild(img);
  } else {
    const v=document.createElement('video'); v.src=url; v.controls=true; v.loop=true; item.appendChild(v);
  }
  if (badge) {
    const b=document.createElement('div');
    b.className='badge badge-'+badge;
    b.textContent = badge==='auto'?'AI':badge==='shot'?'SHOT':'REC';
    item.appendChild(b);
  }
  const dl=document.createElement('button'); dl.className='dl-btn'; dl.textContent='↓';
  dl.onclick=()=>{
    const a=document.createElement('a');
    a.href=blob?URL.createObjectURL(blob):url; a.download=filename; a.click();
  };
  item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & Color Tracker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f; color: #eee;
      font-family: 'Courier New', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px;
    }
    h1 { font-size: 16px; letter-spacing: 0.15em; color: #ff4444; margin-bottom: 14px; text-transform: uppercase; }

    .control-row {
      display: flex; gap: 8px; margin-bottom: 8px;
      align-items: center; flex-wrap: wrap;
      justify-content: center; width: 100%; max-width: 720px;
    }
    button {
      font-family: 'Courier New', monospace; font-size: 11px;
      padding: 6px 12px; border: 1px solid #444; border-radius: 6px;
      background: #1a1a1a; color: #ccc; cursor: pointer; transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: #2a2a2a; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.active-rec { background: #8e44ad; color: #fff; border-color: #9b59b6; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

    select { background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 4px; font-size: 11px; padding: 4px 6px; }
    input[type=range] { accent-color: #27ae60; }

    /* ---- 追跡対象セレクター ---- */
    #targetPanel {
      width: 100%; max-width: 720px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    #targetPanel .panel-title {
      font-size: 10px; color: #666; letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .target-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .target-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border: 1px solid #333; border-radius: 20px;
      font-size: 11px; color: #888; cursor: pointer;
      background: #1a1a1a; transition: all 0.15s;
      user-select: none;
    }
    .target-chip:hover { border-color: #555; color: #bbb; }
    .target-chip.on {
      border-color: var(--chip-color, #ff4444);
      color: var(--chip-color, #ff4444);
      background: color-mix(in srgb, var(--chip-color, #ff4444) 12%, #1a1a1a);
    }
    .chip-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--chip-color, #ff4444);
      opacity: 0.5;
    }
    .target-chip.on .chip-dot { opacity: 1; }

    /* ---- ズームUI ---- */
    #zoomPanel {
      width: 100%; max-width: 720px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: none;
    }
    #zoomPanel.visible { display: block; }
    .zoom-row {
      display: flex; align-items: center; gap: 10px;
    }
    .zoom-label {
      font-size: 12px; color: #7dcea0; min-width: 72px; letter-spacing: 0.05em;
    }
    .zoom-btn {
      width: 30px; height: 30px; border-radius: 50%;
      padding: 0; font-size: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-color: #2e7d52; color: #7dcea0;
    }
    .zoom-btn:hover:not(:disabled) { background: #1a2e22; }
    #zoomRange { flex: 1; accent-color: #27ae60; }
    .zoom-reset {
      font-size: 10px; padding: 4px 10px;
      border-color: #2e7d52; color: #7dcea0;
    }
    .zoom-reset:hover:not(:disabled) { background: #1a2e22; }
    #zoomMode { font-size: 9px; color: #555; margin-top: 5px; }

    /* ---- Canvas ---- */
    #canvas-wrap {
      position: relative; border: 1px solid #2a2a2a;
      border-radius: 10px; overflow: hidden;
      width: 100%; max-width: 720px; aspect-ratio: 4/3;
      background: #111;
    }
    #vid, #canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    #vid { opacity: 0; }
    #recHud {
      position: absolute; top: 10px; right: 12px;
      color: #9b59b6; display: none; font-size: 10px; letter-spacing: 0.08em;
    }
    #zoomHud {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px; color: #7dcea0; letter-spacing: 0.08em;
      pointer-events: none; display: none;
    }
    #modelStatus {
      position: absolute; bottom: 10px; left: 12px;
      font-size: 9px; color: #555; pointer-events: none;
    }

    /* ---- ギャラリー ---- */
    #galleryGrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px; margin-top: 15px; width: 100%; max-width: 720px;
    }
    .gallery-item { border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; position: relative; }
    .gallery-item img, .gallery-item video { width: 100%; display: block; }
    .dl-btn {
      position: absolute; bottom: 4px; right: 4px;
      font-size: 10px; padding: 2px 7px; border-radius: 4px;
      background: rgba(0,0,0,0.75); border: 1px solid #444; color: #ccc; cursor: pointer;
    }
  </style>
</head>
<body>

<h1>&#9654; AI & Color Tracker Pro</h1>

<!-- カメラ・録画コントロール -->
<div class="control-row">
  <select id="camSelect"><option>Loading...</option></select>
  <button id="btnStart">START</button>
  <button id="btnStop" disabled>STOP</button>
  <button id="btnShot" disabled style="color:#5dade2; border-color:#2980b9;">&#128247; SHOT</button>
  <button id="btnRec" disabled>&#9210; REC</button>
  <button id="btnRecStop" disabled>&#9209; STOP</button>
</div>

<div class="control-row">
  <label style="font-size:10px; color:#888;">カラー検出色
    <select id="ballColor" style="margin-left:4px;">
      <option value="none">なし</option>
      <option value="white">白</option>
      <option value="orange">オレンジ</option>
      <option value="yellow">黄色</option>
      <option value="red">赤</option>
    </select>
  </label>
  <label style="font-size:10px; color:#888;">軌跡の長さ
    <input type="range" id="trail" min="5" max="150" value="60" style="margin-left:4px; width:80px;">
    <span id="trailVal" style="color:#aaa;">60</span>
  </label>
</div>

<!-- 追跡対象セレクター -->
<div id="targetPanel">
  <div class="panel-title">TRACKING TARGETS ― クリックでON/OFF（複数選択可）</div>
  <div class="target-grid" id="targetGrid"></div>
</div>

<!-- ズームパネル -->
<div id="zoomPanel">
  <div class="zoom-row">
    <span class="zoom-label">ZOOM &#215;<span id="zoomVal">1.0</span></span>
    <button class="zoom-btn" id="btnZoomOut">&#8722;</button>
    <input type="range" id="zoomRange" min="100" max="800" value="100">
    <button class="zoom-btn" id="btnZoomIn">&#43;</button>
    <button class="zoom-reset" id="btnZoomReset">RESET</button>
  </div>
  <div id="zoomMode"></div>
</div>

<!-- カメラ映像 -->
<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="recHud">&#9210; REC</div>
  <div id="zoomHud">&#128269; &#215;<span id="zoomHudVal">1.0</span></div>
  <div id="modelStatus">AI MODEL: Loading...</div>
</div>

<div id="galleryGrid"></div>

<script>
// ---- DOM refs ----
const vid       = document.getElementById('vid');
const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const camSelect = document.getElementById('camSelect');
const ballColorSel = document.getElementById('ballColor');
const btnStart  = document.getElementById('btnStart');
const btnStop   = document.getElementById('btnStop');
const btnShot   = document.getElementById('btnShot');
const btnRec    = document.getElementById('btnRec');
const btnRecStop= document.getElementById('btnRecStop');
const zoomRange = document.getElementById('zoomRange');
const zoomPanel = document.getElementById('zoomPanel');
const zoomHud   = document.getElementById('zoomHud');
const zoomHudVal= document.getElementById('zoomHudVal');
const trailSlider = document.getElementById('trail');
const trailValEl  = document.getElementById('trailVal');
const modelStatus = document.getElementById('modelStatus');

// ---- State ----
let model = null, stream = null, animId = null;
let trails = {}, zoomLevel = 1.0, currentTrack = null;
let nativeZoom = false;
let mediaRecorder = null, recordedChunks = [];
let isFrontCamera = false;

// ---- 追跡対象定義 (COCO-SSD クラス名 → 表示名 + 色) ----
const ALL_TARGETS = [
  { key: 'person',       label: '人',         color: '#e74c3c' },
  { key: 'car',          label: '車',          color: '#e67e22' },
  { key: 'bicycle',      label: '自転車',      color: '#f1c40f' },
  { key: 'motorcycle',   label: 'バイク',      color: '#e67e22' },
  { key: 'bus',          label: 'バス',        color: '#e74c3c' },
  { key: 'truck',        label: 'トラック',    color: '#c0392b' },
  { key: 'sports ball',  label: 'ボール(AI)',  color: '#2ecc71' },
  { key: 'golf club',    label: 'ゴルフクラブ',color: '#1abc9c' },
  { key: 'tennis racket',label: 'テニスラケット',color: '#3498db' },
  { key: 'cat',          label: '猫',          color: '#9b59b6' },
  { key: 'dog',          label: '犬',          color: '#8e44ad' },
  { key: 'bird',         label: '鳥',          color: '#1abc9c' },
  { key: 'cell phone',   label: 'スマホ',      color: '#95a5a6' },
  { key: 'bottle',       label: 'ボトル',      color: '#27ae60' },
  { key: 'COLOR_BALL',   label: 'カラーボール', color: '#ffff00' },
];

// デフォルトON
const DEFAULT_ON = new Set(['person', 'sports ball', 'COLOR_BALL']);
let activeTargets = new Set(DEFAULT_ON);

// チップ生成
const targetGrid = document.getElementById('targetGrid');
ALL_TARGETS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'target-chip' + (activeTargets.has(t.key) ? ' on' : '');
  chip.style.setProperty('--chip-color', t.color);
  chip.dataset.key = t.key;
  chip.innerHTML = `<span class="chip-dot"></span>${t.label}`;
  chip.addEventListener('click', () => {
    if (activeTargets.has(t.key)) {
      activeTargets.delete(t.key);
      chip.classList.remove('on');
    } else {
      activeTargets.add(t.key);
      chip.classList.add('on');
    }
    // 無効化したターゲットの軌跡をクリア
    Object.keys(trails).forEach(id => {
      if (!isActiveId(id)) delete trails[id];
    });
  });
  targetGrid.appendChild(chip);
});

function isActiveId(trailId) {
  for (const t of ALL_TARGETS) {
    if (activeTargets.has(t.key) && trailId.startsWith(t.key + '_')) return true;
  }
  return false;
}

function getTargetInfo(classKey) {
  return ALL_TARGETS.find(t => t.key === classKey);
}

// 軌跡の長さ表示
trailSlider.addEventListener('input', () => { trailValEl.textContent = trailSlider.value; });

// ---- AI モデル & カメラ一覧 ----
async function init() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');

    // バックカメラを優先してソート
    cams.sort((a, b) => {
      const aBack = /back|rear|environment/i.test(a.label);
      const bBack = /back|rear|environment/i.test(b.label);
      return bBack - aBack;
    });

    camSelect.innerHTML = cams.map(d =>
      `<option value="${d.deviceId}">${d.label || 'Camera ' + d.deviceId.slice(0,4)}</option>`
    ).join('');

    modelStatus.textContent = 'AI MODEL: Loading...';
    model = await cocoSsd.load();
    modelStatus.textContent = 'AI MODEL: Ready ✓';
  } catch(e) {
    console.error('Init error:', e);
    modelStatus.textContent = 'AI MODEL: Error';
  }
}
init();

// ---- カメラ起動 ----
btnStart.onclick = async () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  trails = {};

  try {
    // まずバックカメラを明示的にリクエスト
    let constraints = {
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    };
    // ユーザーがカメラを選んでいる場合はそちらを優先
    if (camSelect.value && camSelect.value !== 'Loading...') {
      constraints = { video: { deviceId: { exact: camSelect.value }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    }

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream;
    await vid.play();

    currentTrack = stream.getVideoTracks()[0];
    const settings = currentTrack.getSettings();
    const facing = settings.facingMode || '';
    const lbl = (currentTrack.label || '').toLowerCase();
    isFrontCamera = facing === 'user' || lbl.includes('front') || lbl.includes('前面');

    // ズームパネル初期化
    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (caps.zoom) {
      nativeZoom = true;
      zoomRange.min = Math.round((caps.zoom.min || 1) * 100);
      zoomRange.max = Math.round((caps.zoom.max || 8) * 100);
      document.getElementById('zoomMode').textContent = 'ネイティブズーム対応（光学）';
      document.getElementById('zoomMode').style.color = '#27ae60';
    } else {
      nativeZoom = false;
      zoomRange.min = 100; zoomRange.max = 800;
      document.getElementById('zoomMode').textContent = 'デジタルズーム';
      document.getElementById('zoomMode').style.color = '#666';
    }
    zoomRange.value = 100;
    updateZoom(1.0);
    zoomPanel.classList.add('visible');

    btnStart.disabled = true; btnStop.disabled = false;
    btnShot.disabled = false; btnRec.disabled = false;
    loop();
  } catch(e) {
    alert('Camera Error: ' + e.message);
    console.error(e);
  }
};

// ---- ズーム ----
function updateZoom(v) {
  v = Math.max(1.0, Math.min(8.0, v));
  zoomLevel = v;
  const disp = v.toFixed(1);
  document.getElementById('zoomVal').textContent = disp;
  zoomHudVal.textContent = disp;
  zoomRange.value = Math.round(v * 100);
  zoomHud.style.display = v > 1.0 ? 'block' : 'none';
  if (nativeZoom && currentTrack) {
    try { currentTrack.applyConstraints({ advanced: [{ zoom: v }] }); } catch(e) {}
  }
}
zoomRange.addEventListener('input', () => updateZoom(+zoomRange.value / 100));
document.getElementById('btnZoomIn').onclick  = () => updateZoom(zoomLevel + 0.5);
document.getElementById('btnZoomOut').onclick = () => updateZoom(zoomLevel - 0.5);
document.getElementById('btnZoomReset').onclick = () => updateZoom(1.0);

// ピンチズーム
let lastPinchDist = null;
document.getElementById('canvas-wrap').addEventListener('touchstart', e => {
  if (e.touches.length === 2) lastPinchDist = pinchDist(e.touches);
}, { passive: true });
document.getElementById('canvas-wrap').addEventListener('touchmove', e => {
  if (e.touches.length === 2 && lastPinchDist) {
    const d = pinchDist(e.touches);
    updateZoom(zoomLevel + (d - lastPinchDist) / 200);
    lastPinchDist = d;
  }
}, { passive: true });
document.getElementById('canvas-wrap').addEventListener('touchend', () => { lastPinchDist = null; });
function pinchDist(t) {
  const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// ---- メインループ ----
async function loop() {
  const W = canvas.width  = canvas.parentElement.clientWidth;
  const H = canvas.height = canvas.parentElement.clientHeight;

  // デジタルズーム（ネイティブ非対応時）
  const dz = nativeZoom ? 1.0 : zoomLevel;
  const sw = vid.videoWidth / dz, sh = vid.videoHeight / dz;
  const sx = (vid.videoWidth - sw) / 2, sy = (vid.videoHeight - sh) / 2;

  ctx.save();
  if (isFrontCamera) {
    ctx.scale(-1, 1);
    ctx.drawImage(vid, sx, sy, sw, sh, -W, 0, W, H);
  } else {
    ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, W, H);
  }
  ctx.restore();

  if (!model) { animId = requestAnimationFrame(loop); return; }

  // AI 検出
  const predictions = await model.detect(canvas);

  // アクティブなAIターゲットだけフィルタ
  let objects = predictions
    .filter(p => activeTargets.has(p.class))
    .map(p => ({
      classKey: p.class,
      bbox: p.bbox,
      score: p.score
    }));

  // カラーボール検出
  if (activeTargets.has('COLOR_BALL') && ballColorSel.value !== 'none') {
    const cb = detectBallByColor();
    if (cb) objects.push({ classKey: 'COLOR_BALL', bbox: [cb.x - 15, cb.y - 15, 30, 30], score: 1.0 });
  }

  // インスタンスIDを安定させるために bbox の位置で近傍マッチング
  const usedIds = new Set();
  objects.forEach((obj, idx) => {
    const ti = getTargetInfo(obj.classKey);
    if (!ti) return;

    const cx = obj.bbox[0] + obj.bbox[2] / 2;
    const cy = obj.bbox[1] + obj.bbox[3] / 2;

    // 既存の軌跡と近傍マッチング（同クラスの中で最も近い軌跡を引き継ぐ）
    let bestId = null, bestDist = 80;
    Object.keys(trails).forEach(id => {
      if (!id.startsWith(obj.classKey + '_')) return;
      if (usedIds.has(id)) return;
      const last = trails[id][trails[id].length - 1];
      const d = Math.hypot(cx - last.x, cy - last.y);
      if (d < bestDist) { bestDist = d; bestId = id; }
    });
    const trailId = bestId || (obj.classKey + '_' + idx + '_' + Date.now());
    usedIds.add(trailId);

    if (!trails[trailId]) trails[trailId] = [];
    trails[trailId].push({ x: cx, y: cy });
    const maxLen = +trailSlider.value;
    if (trails[trailId].length > maxLen) trails[trailId].shift();

    const color = ti.color;
    const trail = trails[trailId];

    // ---- バウンディングボックス描画 ----
    const [bx, by, bw, bh] = obj.bbox;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.strokeRect(bx, by, bw, bh);

    // ラベル背景
    ctx.font = 'bold 11px Courier New';
    const labelText = ti.label + (obj.score < 1 ? ' ' + Math.round(obj.score * 100) + '%' : '');
    const tw = ctx.measureText(labelText).width + 8;
    ctx.fillStyle = color;
    ctx.fillRect(bx, by - 16, tw, 16);
    ctx.fillStyle = '#000';
    ctx.fillText(labelText, bx + 4, by - 4);

    // ---- 中心点のみの軌跡（グラデーション） ----
    if (trail.length >= 2) {
      for (let i = 1; i < trail.length; i++) {
        const alpha = i / trail.length;
        ctx.beginPath();
        ctx.moveTo(trail[i-1].x, trail[i-1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = hexAlpha(color, alpha * 0.9);
        ctx.lineWidth = 1 + alpha * 2.5;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    // 先端の中心点
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.strokeStyle = hexAlpha(color, 0.35);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // 古い軌跡を掃除
  Object.keys(trails).forEach(id => {
    if (!usedIds.has(id)) {
      trails[id].push(null); // 切れ目マーカー
      if (trails[id].filter(Boolean).length === 0) delete trails[id];
      else if (trails[id].length > +trailSlider.value + 10) delete trails[id];
    }
  });

  animId = requestAnimationFrame(loop);
}

// hex color → rgba文字列
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---- カラーボール検出 ----
function detectBallByColor() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const target = ballColorSel.value;
  let sx = 0, sy = 0, cnt = 0;
  for (let y = 0; y < canvas.height; y += 8) {
    for (let x = 0; x < canvas.width; x += 8) {
      const i = (y * canvas.width + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      let m = false;
      if (target === 'white'  && r > 210 && g > 210 && b > 210) m = true;
      if (target === 'orange' && r > 200 && g > 90  && g < 170 && b < 80) m = true;
      if (target === 'yellow' && r > 200 && g > 200 && b < 100) m = true;
      if (target === 'red'    && r > 160 && g < 80  && b < 80) m = true;
      if (m) { sx += x; sy += y; cnt++; }
    }
  }
  return cnt > 5 ? { x: sx/cnt, y: sy/cnt } : null;
}

// ---- スクリーンショット ----
btnShot.onclick = () => {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'shot_' + Date.now() + '.png';
  a.click();
  // ギャラリーにも追加
  const item = document.createElement('div'); item.className = 'gallery-item';
  const img = document.createElement('img'); img.src = a.href;
  const dl = document.createElement('button'); dl.className = 'dl-btn'; dl.textContent = '↓';
  dl.onclick = () => { const b = document.createElement('a'); b.href = img.src; b.download = 'shot_' + Date.now() + '.png'; b.click(); };
  item.appendChild(img); item.appendChild(dl);
  document.getElementById('galleryGrid').prepend(item);
};

// ---- 録画 ----
btnRec.onclick = () => {
  recordedChunks = [];
  const mimeType = ['video/mp4','video/webm;codecs=h264','video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  try { mediaRecorder = new MediaRecorder(canvas.captureStream(30), mimeType ? { mimeType } : {}); }
  catch(e) { mediaRecorder = new MediaRecorder(canvas.captureStream(30)); }
  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const item = document.createElement('div'); item.className = 'gallery-item';
    const v = document.createElement('video'); v.src = url; v.controls = true; v.loop = true;
    const dl = document.createElement('button'); dl.className = 'dl-btn'; dl.textContent = '↓';
    const ext = (mediaRecorder.mimeType||'').includes('mp4') ? 'mp4' : 'webm';
    dl.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = 'rec_' + Date.now() + '.' + ext; a.click(); };
    item.appendChild(v); item.appendChild(dl);
    document.getElementById('galleryGrid').prepend(item);
  };
  mediaRecorder.start(100);
  btnRec.disabled = true; btnRecStop.disabled = false;
  btnRecStop.classList.add('active-rec');
  document.getElementById('recHud').style.display = 'block';
};

btnRecStop.onclick = () => {
  mediaRecorder.stop();
  btnRec.disabled = false; btnRecStop.disabled = true;
  btnRecStop.classList.remove('active-rec');
  document.getElementById('recHud').style.display = 'none';
};

btnStop.onclick = () => {
  if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
  cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; currentTrack = null;
  zoomPanel.classList.remove('visible');
  zoomHud.style.display = 'none';
  btnStart.disabled = false; btnStop.disabled = true;
  btnShot.disabled = true; btnRec.disabled = true; btnRecStop.disabled = true;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};
</script>
</body>
</html>

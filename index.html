<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動体追跡カメラ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 16px;
      letter-spacing: 0.15em;
      color: #ff4444;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 7px 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1a1a1a;
      color: #ccc;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: #2a2a2a; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.active { background: #c0392b; color: #fff; border-color: #e74c3c; }
    label {
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type=range] { width: 80px; accent-color: #e74c3c; }
    #status { font-size: 11px; color: #666; margin-left: 8px; }
    #canvas-wrap {
      position: relative;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 4/3;
    }
    #vid, #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #vid { opacity: 0; }
    #canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px; left: 12px;
      font-size: 11px;
      color: #ff4444;
      letter-spacing: 0.1em;
      pointer-events: none;
    }
    #info {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #info span { color: #aaa; font-weight: bold; }
    #error {
      margin-top: 12px;
      font-size: 12px;
      color: #e74c3c;
      text-align: center;
      max-width: 500px;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>
<body>

<h1>▶ Motion Tracker</h1>

<div id="controls">
  <button id="btnStart">カメラ起動</button>
  <button id="btnStop" disabled>停止</button>
  <label>感度
    <input type="range" id="sens" min="5" max="60" value="25" step="1">
    <span id="sensVal">25</span>
  </label>
  <label>軌跡
    <input type="range" id="trail" min="10" max="120" value="50" step="5">
    <span id="trailVal">50</span>
  </label>
  <span id="status">待機中</span>
</div>

<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="hud">● REC</div>
</div>

<div id="info">
  <div>物体数: <span id="objCount">0</span></div>
  <div>最大速度: <span id="maxSpeed">0</span> px/s</div>
  <div>FPS: <span id="fps">0</span></div>
</div>

<div id="error"></div>

<script>
const vid = document.getElementById('vid');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const statusEl = document.getElementById('status');
const sensEl = document.getElementById('sens');
const sensValEl = document.getElementById('sensVal');
const trailEl = document.getElementById('trail');
const trailValEl = document.getElementById('trailVal');
const objCountEl = document.getElementById('objCount');
const maxSpeedEl = document.getElementById('maxSpeed');
const fpsEl = document.getElementById('fps');
const hud = document.getElementById('hud');
const errorEl = document.getElementById('error');

let stream = null;
let animId = null;
let prevFrame = null;
let trails = [];
let maxTrailLen = 50;
let sensitivity = 25;
let frameCount = 0;
let lastFpsTime = performance.now();
let currentFps = 0;

sensEl.addEventListener('input', () => {
  sensitivity = +sensEl.value;
  sensValEl.textContent = sensitivity;
});
trailEl.addEventListener('input', () => {
  maxTrailLen = +trailEl.value;
  trailValEl.textContent = maxTrailLen;
});

btnStart.addEventListener('click', async () => {
  errorEl.style.display = 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    vid.srcObject = stream;
    await vid.play();
    btnStart.disabled = true;
    btnStop.disabled = false;
    btnStop.classList.add('active');
    statusEl.textContent = '追跡中...';
    hud.style.color = '#ff3333';
    prevFrame = null;
    trails = [];
    frameCount = 0;
    lastFpsTime = performance.now();
    loop();
  } catch(e) {
    let msg = 'カメラにアクセスできませんでした。';
    if (e.name === 'NotAllowedError') {
      msg += '<br>ブラウザのアドレスバー左の🔒アイコン→「カメラ」→「許可」に変更してページをリロードしてください。';
    } else if (e.name === 'NotFoundError') {
      msg += '<br>カメラデバイスが見つかりません。';
    } else {
      msg += '<br>' + e.message;
    }
    errorEl.innerHTML = msg;
    errorEl.style.display = 'block';
    statusEl.textContent = 'エラー';
  }
});

btnStop.addEventListener('click', () => {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  btnStart.disabled = false;
  btnStop.disabled = true;
  btnStop.classList.remove('active');
  statusEl.textContent = '停止';
  hud.style.color = '#444';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawStandby();
});

function resize() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}

function drawStandby() {
  ctx.fillStyle = '#2a2a2a';
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('「カメラ起動」を押してください', canvas.width / 2, canvas.height / 2);
}

function loop() {
  resize();
  if (!vid.videoWidth) { animId = requestAnimationFrame(loop); return; }

  const W = canvas.width, H = canvas.height;
  const vw = vid.videoWidth, vh = vid.videoHeight;

  // ミラー描画
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(vid, -W, 0, W, H);
  ctx.restore();

  // 差分検出用の小さいバッファ
  const offscreen = document.createElement('canvas');
  offscreen.width = Math.floor(vw / 4);
  offscreen.height = Math.floor(vh / 4);
  const oc = offscreen.getContext('2d');
  oc.drawImage(vid, 0, 0, offscreen.width, offscreen.height);
  const cur = oc.getImageData(0, 0, offscreen.width, offscreen.height);

  let detectedPoints = [];

  if (prevFrame) {
    const curD = cur.data;
    const prevD = prevFrame.data;
    const ow = offscreen.width, oh = offscreen.height;
    const cellSize = 8;
    const cols = Math.floor(ow / cellSize);
    const rows = Math.floor(oh / cellSize);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let diffSum = 0, count = 0;
        for (let dy = 0; dy < cellSize; dy++) {
          for (let dx = 0; dx < cellSize; dx++) {
            const px = c * cellSize + dx;
            const py = r * cellSize + dy;
            if (px >= ow || py >= oh) continue;
            const i = (py * ow + px) * 4;
            const dr = Math.abs(curD[i] - prevD[i]);
            const dg = Math.abs(curD[i+1] - prevD[i+1]);
            const db = Math.abs(curD[i+2] - prevD[i+2]);
            diffSum += (dr + dg + db) / 3;
            count++;
          }
        }
        if (count > 0 && diffSum / count > sensitivity) {
          const cx = (c * cellSize + cellSize / 2) / ow;
          const cy = (r * cellSize + cellSize / 2) / oh;
          detectedPoints.push({ x: (1 - cx) * W, y: cy * H });
        }
      }
    }
  }
  prevFrame = cur;

  const clusters = clusterPoints(detectedPoints, W * 0.08);

  while (trails.length < clusters.length) trails.push([]);
  while (trails.length > clusters.length + 2) trails.pop();

  let maxSpd = 0;
  clusters.forEach((pt, i) => {
    if (!trails[i]) trails[i] = [];
    const t = trails[i];
    if (t.length > 0) {
      const prev = t[t.length - 1];
      const dx = pt.x - prev.x, dy = pt.y - prev.y;
      const spd = Math.sqrt(dx*dx + dy*dy) * currentFps;
      if (spd > maxSpd) maxSpd = spd;
    }
    t.push({ x: pt.x, y: pt.y });
    if (t.length > maxTrailLen) t.shift();
  });
  trails = trails.filter(t => t.length > 0);

  trails.forEach(t => {
    if (t.length < 2) return;

    // グラデーション軌跡（古い→新しい）
    for (let i = 1; i < t.length; i++) {
      const alpha = i / t.length;
      ctx.beginPath();
      ctx.moveTo(t[i-1].x, t[i-1].y);
      ctx.lineTo(t[i].x, t[i].y);
      ctx.strokeStyle = `rgba(226,75,74,${alpha * 0.9})`;
      ctx.lineWidth = 1.5 + alpha * 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const tip = t[t.length - 1];
    // 先端の点
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3333';
    ctx.fill();
    // 外リング
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 11, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,60,60,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // FPS 計算
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime > 1000) {
    currentFps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
    frameCount = 0;
    lastFpsTime = now;
    fpsEl.textContent = currentFps;
  }
  objCountEl.textContent = clusters.length;
  maxSpeedEl.textContent = Math.round(maxSpd);

  animId = requestAnimationFrame(loop);
}

function clusterPoints(pts, radius) {
  if (!pts.length) return [];
  const visited = new Array(pts.length).fill(false);
  const clusters = [];
  for (let i = 0; i < pts.length; i++) {
    if (visited[i]) continue;
    let cx = pts[i].x, cy = pts[i].y, cnt = 1;
    visited[i] = true;
    for (let j = i+1; j < pts.length; j++) {
      if (visited[j]) continue;
      const dx = pts[j].x - pts[i].x;
      const dy = pts[j].y - pts[i].y;
      if (Math.sqrt(dx*dx + dy*dy) < radius) {
        cx += pts[j].x; cy += pts[j].y; cnt++;
        visited[j] = true;
      }
    }
    clusters.push({ x: cx/cnt, y: cy/cnt });
  }
  return clusters;
}

// 初期表示
resize();
ctx.fillStyle = '#111';
ctx.fillRect(0, 0, canvas.width, canvas.height);
drawStandby();
window.addEventListener('resize', () => { if (!stream) { resize(); drawStandby(); } });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI & Color Tracker Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    /* ---- 全体レイアウト調整 ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center;
    }

    /* ---- 1. 映像表示エリア（最上部） ---- */
    #canvas-wrap {
      position: relative; 
      width: 100%; 
      max-width: 720px; 
      aspect-ratio: 4/3; 
      background: #111;
      overflow: hidden;
      border-bottom: 1px solid #2a2a2a;
    }
    #vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #canvas-wrap.tap-mode { cursor: crosshair; }

    /* HUD 類 (映像に重なる情報) */
    #recHud    { position: absolute; top: 12px; right: 12px; color: #ff4444; display: none; font-size: 11px; font-weight: bold; text-shadow: 0 0 4px #000; }
    #zoomHud   { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #7dcea0; pointer-events: none; display: none; text-shadow: 0 0 4px #000; }
    #tapHud    { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #27ae60; pointer-events: none; display: none; white-space: nowrap; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; z-index: 10; }
    #modelStatus { position: absolute; bottom: 8px; left: 10px; font-size: 9px; color: #555; pointer-events: none; }
    #fpsHud    { position: absolute; top: 12px; left: 12px; font-size: 10px; color: #888; pointer-events: none; }

    /* ---- 2. 設定エリア（下部） ---- */
    #ui-container {
      width: 100%;
      max-width: 720px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 { font-size: 14px; letter-spacing: 0.1em; color: #ff4444; text-transform: uppercase; text-align: center; margin-bottom: 4px; }

    .control-row {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%;
    }
    
    /* スマホで押しやすいようボタンを調整 */
    button {
      font-size: 11px; padding: 10px 14px; border: 1px solid #444; border-radius: 8px;
      background: #1a1a1a; color: #ccc; cursor: pointer; transition: 0.2s;
    }
    button:active { background: #333; }
    button:disabled { opacity: 0.3; }
    button.active-rec { background: #c0392b; color: #fff; border-color: #e74c3c; animation: pulse 1.2s infinite; }
    button.active-tap { background: #1a6b3a; color: #7dcea0; border-color: #27ae60; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

    select { background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 6px; font-size: 12px; padding: 8px; }
    input[type=range] { accent-color: #27ae60; height: 20px; }

    /* パネル類 */
    #targetPanel, #zoomPanel {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; padding: 12px;
    }
    #zoomPanel { display: none; }
    #zoomPanel.visible { display: block; }
    .panel-title { font-size: 10px; color: #666; margin-bottom: 10px; text-transform: uppercase; }
    
    .target-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .target-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid #333; border-radius: 20px;
      font-size: 11px; color: #888; background: #1a1a1a; user-select: none;
    }
    .target-chip.on { border-color: var(--chip-color); color: var(--chip-color); background: rgba(255,255,255,0.05); }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chip-color); opacity: 0.4; }
    .target-chip.on .chip-dot { opacity: 1; }

    .zoom-row { display: flex; align-items: center; gap: 10px; }
    .zoom-label { font-size: 12px; color: #7dcea0; min-width: 65px; }
    #zoomRange { flex: 1; }

    /* ギャラリー */
    #galleryGrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px; padding: 15px; width: 100%; max-width: 720px;
    }
    .gallery-item { border-radius: 8px; overflow: hidden; background: #1a1a1a; position: relative; border: 1px solid #2a2a2a; }
    .gallery-item img, .gallery-item video { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
    .dl-btn { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; }

    /* ---- 3. スマホ横向き（ランドスケープ）全画面対応 ---- */
    @media (orientation: landscape) and (max-height: 500px) {
      body { overflow: hidden; }
      #canvas-wrap {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        max-width: none; border: none; z-index: 100;
      }
      #ui-container, h1, #galleryGrid { display: none !important; }
      
      /* 横向き時、HUD の位置を調整 */
      #tapHud { bottom: 15px; font-size: 13px; }
      #recHud { top: 15px; right: 20px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="canvas-wrap">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="recHud">● REC</div>
  <div id="zoomHud">🔍 ×<span id="zoomHudVal">1.0</span></div>
  <div id="tapHud">追跡する物体をタップ</div>
  <div id="modelStatus">AI MODEL: Loading...</div>
  <div id="fpsHud">-- fps</div>
</div>

<div id="ui-container">
  <h1>AI & Color Tracker Pro</h1>

  <div class="control-row">
    <select id="camSelect"><option>Loading...</option></select>
    <button id="btnStart">開始</button>
    <button id="btnStop" disabled>停止</button>
  </div>

  <div class="control-row">
    <button id="btnShot" disabled style="color:#5dade2;">📸 SHOT</button>
    <button id="btnRec" disabled>⏺ REC</button>
    <button id="btnRecStop" disabled>⏹ STOP</button>
  </div>

  <div class="control-row">
    <button id="btnTapMode" disabled>🎯 タップ選択</button>
    <button id="btnClearTap" disabled>クリア</button>
    <select id="ballColor">
      <option value="none">色認識: OFF</option>
      <option value="white">白</option>
      <option value="orange">オレンジ</option>
      <option value="yellow">黄色</option>
      <option value="red">赤</option>
    </select>
  </div>

  <div id="zoomPanel">
    <div class="zoom-row">
      <span class="zoom-label">ZOOM ×<span id="zoomVal">1.0</span></span>
      <button id="btnZoomOut" style="padding:5px 12px;">−</button>
      <input type="range" id="zoomRange" min="100" max="800" value="100">
      <button id="btnZoomIn" style="padding:5px 12px;">＋</button>
    </div>
  </div>

  <div id="targetPanel">
    <div class="panel-title">追跡対象（複数選択可 / タップモード有効時は優先追跡）</div>
    <div class="target-grid" id="targetGrid"></div>
  </div>

  <div class="control-row">
    <label style="font-size:10px; color:#666;">軌跡の長さ: <span id="trailVal">60</span>
      <input type="range" id="trail" min="5" max="150" value="60" style="width:100px; vertical-align:middle; margin-left:10px;">
    </label>
  </div>
</div>

<div id="galleryGrid"></div>

<script>
/**
 * スクリプト部分は、添付いただいた index.html の高機能ロジック
 * （タップ選択、マルチターゲット追跡、ネイティブズーム、ピンチズーム等）
 * をそのまま引き継いでいます。
 */
const vid          = document.getElementById('vid');
const canvas       = document.getElementById('canvas');
const ctx          = canvas.getContext('2d');
const camSelect    = document.getElementById('camSelect');
const ballColorSel = document.getElementById('ballColor');
const btnStart     = document.getElementById('btnStart');
const btnStop      = document.getElementById('btnStop');
const btnShot      = document.getElementById('btnShot');
const btnRec       = document.getElementById('btnRec');
const btnRecStop   = document.getElementById('btnRecStop');
const btnTapMode   = document.getElementById('btnTapMode');
const btnClearTap  = document.getElementById('btnClearTap');
const zoomRange    = document.getElementById('zoomRange');
const zoomPanel    = document.getElementById('zoomPanel');
const zoomHud      = document.getElementById('zoomHud');
const zoomHudVal   = document.getElementById('zoomHudVal');
const trailSlider  = document.getElementById('trail');
const trailValEl   = document.getElementById('trailVal');
const modelStatus  = document.getElementById('modelStatus');
const fpsHud       = document.getElementById('fpsHud');
const canvasWrap   = document.getElementById('canvas-wrap');
const tapHud       = document.getElementById('tapHud');

const ALL_TARGETS = [
  { key: 'person',        label: '人',           color: '#e74c3c' },
  { key: 'sports ball',   label: 'ボール(AI)',    color: '#2ecc71' },
  { key: 'golf club',     label: 'クラブ',        color: '#1abc9c' },
  { key: 'car',           label: '車',           color: '#e67e22' },
  { key: 'cat',           label: '猫',           color: '#9b59b6' },
  { key: 'dog',           label: '犬',           color: '#8e44ad' },
  { key: 'COLOR_BALL',    label: 'カラー',        color: '#ffff00' },
];
let activeTargets = new Set(['person', 'sports ball', 'COLOR_BALL']);

// ターゲットチップ生成
const targetGrid = document.getElementById('targetGrid');
ALL_TARGETS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'target-chip' + (activeTargets.has(t.key) ? ' on' : '');
  chip.style.setProperty('--chip-color', t.color);
  chip.innerHTML = `<span class="chip-dot"></span>${t.label}`;
  chip.onclick = () => {
    if (activeTargets.has(t.key)) { activeTargets.delete(t.key); chip.classList.remove('on'); }
    else { activeTargets.add(t.key); chip.classList.add('on'); }
  };
  targetGrid.appendChild(chip);
});

// State & Core Logic
let model = null, stream = null, drawAnimId = null, isRunning = false;
let zoomLevel = 1.0, currentTrack = null, isFrontCamera = false, nativeZoom = false;
let mediaRecorder = null, recordedChunks = [];
let detections = [], trails = {}, pinnedTargets = [], tapRipples = [], tapModeActive = false;
let fpsFrames = 0, fpsLast = performance.now();

async function init() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    camSelect.innerHTML = cams.map(d => `<option value="${d.deviceId}">${d.label || 'Camera '+d.deviceId.slice(0,4)}</option>`).join('');
    model = await cocoSsd.load();
    modelStatus.textContent = 'AI MODEL: Ready ✓';
  } catch(e) { modelStatus.textContent = 'AI MODEL: Error'; }
}
init();

btnStart.onclick = async () => {
  try {
    const constraints = { video: { deviceId: camSelect.value ? { exact: camSelect.value } : undefined, width: 1280, height: 720 } };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream;
    await vid.play();
    currentTrack = stream.getVideoTracks()[0];
    const settings = currentTrack.getSettings();
    isFrontCamera = settings.facingMode === 'user' || (currentTrack.label||'').toLowerCase().includes('front');
    
    // ズーム対応確認
    const caps = currentTrack.getCapabilities?.() || {};
    nativeZoom = !!caps.zoom;
    zoomPanel.classList.add('visible');

    isRunning = true;
    btnStart.disabled = true; btnStop.disabled = false;
    btnShot.disabled = false; btnRec.disabled = false;
    btnTapMode.disabled = false; btnClearTap.disabled = false;
    
    syncSize();
    drawLoop();
    detectionLoop();
  } catch(e) { alert(e.message); }
};

function syncSize() {
  canvas.width = canvasWrap.clientWidth;
  canvas.height = canvasWrap.clientHeight;
}
window.onresize = syncSize;

// 描画ループ (主要ロジック維持)
function drawLoop() {
  if (!isRunning) return;
  const W = canvas.width, H = canvas.height;
  const dz = nativeZoom ? 1.0 : zoomLevel;
  const sw = vid.videoWidth / dz, sh = vid.videoHeight / dz;
  const sx = (vid.videoWidth - sw) / 2, sy = (vid.videoHeight - sh) / 2;

  ctx.save();
  if (isFrontCamera) { ctx.scale(-1, 1); ctx.drawImage(vid, sx, sy, sw, sh, -W, 0, W, H); }
  else { ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, W, H); }
  ctx.restore();

  const maxL = +trailSlider.value;
  const now = performance.now();

  // タップ選択ターゲットの更新と描画
  if (tapModeActive && pinnedTargets.length > 0) {
    pinnedTargets.forEach(pt => {
      let best = null, dist = 100;
      detections.forEach(det => {
        if (det.classKey !== pt.classKey) return;
        const d = Math.hypot(det.cx - (pt.bbox[0]+pt.bbox[2]/2), det.cy - (pt.bbox[1]+pt.bbox[3]/2));
        if (d < dist) { dist = d; best = det; }
      });
      if (best) {
        pt.bbox = [...best.bbox];
        updateTrail(pt.trailId, best.cx, best.cy, maxL);
      }
      drawBox(pt.bbox[0], pt.bbox[1], pt.bbox[2], pt.bbox[3], pt.color, pt.label, 1);
      drawTrailLines(pt.trailId, pt.color);
    });
  } else {
    // 通常モード
    if (activeTargets.has('COLOR_BALL') && ballColorSel.value !== 'none') {
      const cb = detectBallByColor(W, H);
      if (cb) {
        updateTrail('color_0', cb.x, cb.y, maxL);
        drawBox(cb.x-15, cb.y-15, 30, 30, '#ffff00', 'Ball', 1);
        drawTrailLines('color_0', '#ffff00');
      }
    }
    detections.forEach((det, i) => {
      if (!activeTargets.has(det.classKey)) return;
      const info = ALL_TARGETS.find(t => t.key === det.classKey);
      const tid = det.classKey + i;
      updateTrail(tid, det.cx, det.cy, maxL);
      drawBox(det.bbox[0], det.bbox[1], det.bbox[2], det.bbox[3], info.color, info.label, det.score);
      drawTrailLines(tid, info.color);
    });
  }

  // リップル演出
  tapRipples = tapRipples.filter(r => now - r.t < 600);
  tapRipples.forEach(r => {
    ctx.beginPath(); ctx.arc(r.x, r.y, 20 + (now-r.t)/10, 0, 7);
    ctx.strokeStyle = `rgba(255,255,255,${1-(now-r.t)/600})`; ctx.stroke();
  });

  fpsFrames++;
  if (now - fpsLast > 1000) {
    fpsHud.textContent = Math.round(fpsFrames/((now-fpsLast)/1000)) + ' fps';
    fpsFrames = 0; fpsLast = now;
  }
  drawAnimId = requestAnimationFrame(drawLoop);
}

// AI検出
async function detectionLoop() {
  if (!isRunning) return;
  const preds = await model.detect(canvas);
  const W = canvas.width, H = canvas.height;
  detections = preds.map(p => ({
    classKey: p.class, cx: p.bbox[0] + p.bbox[2]/2, cy: p.bbox[1] + p.bbox[3]/2,
    bbox: p.bbox, score: p.score
  }));
  setTimeout(detectionLoop, 50);
}

// ヘルパー関数群
function updateTrail(id, x, y, maxL) {
  if (!trails[id]) trails[id] = [];
  trails[id].push({x, y});
  if (trails[id].length > maxL) trails[id].shift();
}

function drawTrailLines(id, color) {
  const pts = trails[id]; if (!pts || pts.length < 2) return;
  ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle = color;
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();
}

function drawBox(x, y, w, h, color, label, score) {
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y-20, ctx.measureText(label).width+10, 20);
  ctx.fillStyle = "#000"; ctx.fillText(label, x+5, y-5);
}

// タップ選択
canvasWrap.onclick = (e) => {
  if (!tapModeActive) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width/rect.width);
  const y = (e.clientY - rect.top) * (canvas.height/rect.height);
  tapRipples.push({x, y, t: performance.now()});
  
  const hit = detections.find(d => x > d.bbox[0] && x < d.bbox[0]+d.bbox[2] && y > d.bbox[1] && y < d.bbox[1]+d.bbox[3]);
  if (hit) {
    const info = ALL_TARGETS.find(t => t.key === hit.classKey) || {color:'#fff', label:hit.classKey};
    pinnedTargets.push({ trailId: 'pin_'+Date.now(), classKey: hit.classKey, color: info.color, label: info.label, bbox: [...hit.bbox] });
  }
};

btnTapMode.onclick = () => {
  tapModeActive = !tapModeActive;
  btnTapMode.classList.toggle('active-tap', tapModeActive);
  tapHud.style.display = tapModeActive ? 'block' : 'none';
  canvasWrap.classList.toggle('tap-mode', tapModeActive);
};
btnClearTap.onclick = () => { pinnedTargets = []; trails = {}; };

// ズーム・撮影・録画 (既存ロジック)
function applyZoom(v) {
  zoomLevel = Math.max(1, Math.min(8, v));
  zoomValEl.textContent = zoomLevel.toFixed(1);
  zoomHudVal.textContent = zoomLevel.toFixed(1);
  zoomHud.style.display = zoomLevel > 1 ? 'block' : 'none';
  if (nativeZoom) currentTrack.applyConstraints({advanced: [{zoom: zoomLevel}]});
}
zoomRange.oninput = () => applyZoom(zoomRange.value / 100);
document.getElementById('btnZoomIn').onclick = () => applyZoom(zoomLevel + 0.5);
document.getElementById('btnZoomOut').onclick = () => applyZoom(zoomLevel - 0.5);

btnShot.onclick = () => {
  const item = document.createElement('div'); item.className = 'gallery-item';
  item.innerHTML = `<img src="${canvas.toDataURL()}"><button class="dl-btn" onclick="const a=document.createElement('a');a.href='${canvas.toDataURL()}';a.download='shot.png';a.click();">↓</button>`;
  document.getElementById('galleryGrid').prepend(item);
};

btnRec.onclick = () => {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(canvas.captureStream(30));
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(recordedChunks));
    const item = document.createElement('div'); item.className = 'gallery-item';
    item.innerHTML = `<video src="${url}" controls loop><button class="dl-btn" onclick="const a=document.createElement('a');a.href='${url}';a.download='rec.webm';a.click();">↓</button>`;
    document.getElementById('galleryGrid').prepend(item);
  };
  mediaRecorder.start();
  btnRec.disabled = true; btnRecStop.disabled = false;
  btnRecStop.classList.add('active-rec');
  document.getElementById('recHud').style.display = 'block';
};
btnRecStop.onclick = () => {
  mediaRecorder.stop();
  btnRec.disabled = false; btnRecStop.disabled = true;
  btnRecStop.classList.remove('active-rec');
  document.getElementById('recHud').style.display = 'none';
};

btnStop.onclick = () => {
  isRunning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  btnStart.disabled = false; btnStop.disabled = true;
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

// 色認識 (簡易版)
function detectBallByColor(W, H) {
  const off = document.createElement('canvas'); off.width = 160; off.height = 120;
  off.getContext('2d').drawImage(vid, 0, 0, 160, 120);
  const data = off.getContext('2d').getImageData(0, 0, 160, 120).data;
  const target = ballColorSel.value;
  let sx = 0, sy = 0, cnt = 0;
  for(let i=0; i<data.length; i+=4) {
    const r=data[i], g=data[i+1], b=data[i+2];
    let m = false;
    if(target==='white' && r>210 && g>210 && b>210) m=true;
    if(target==='orange' && r>200 && g>100 && b<100) m=true;
    if(m) { const idx=i/4; sx+=idx%160; sy+=Math.floor(idx/160); cnt++; }
  }
  return cnt > 5 ? { x: (sx/cnt)/160*W, y: (sy/cnt)/120*H } : null;
}
</script>
</body>
</html>
